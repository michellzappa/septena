name = "septena-mcp-gateway"
# The Septena account (ADR 0018, moved 2026-11-21). Pinned so a wrangler login with several accounts
# cannot deploy or create resources on the wrong one.
account_id = "1d2ed1f57832a528b7f197b5a9d68d39"
main = "src/index.ts"
compatibility_date = "2024-12-15"
compatibility_flags = ["nodejs_compat_v2"]

# Bind the Worker to the custom domains. Keep this above the first [table]:
# below a table header TOML makes it a key of that table and wrangler
# ignores it. Requires:
#   • septena.app DNS on Cloudflare (done)
#   • Zone "Active" in the Cloudflare dashboard
# mcp.septena.app (the CloudKit connector) was decommissioned 2026-11-20.
routes = [
  # Task backend API (/v1) and the task MCP connector (/mcp).
  { pattern = "api.septena.app", custom_domain = true },
]

# Retain structured logs (the logEvent JSON lines) so a lapse can be
# investigated after the fact instead of only during a live `wrangler tail`.
# Query in the dashboard (Workers → Observability) or via the API.
[observability]
enabled = true
head_sampling_rate = 1

# Allow importing .md files as text modules. Used by src/index.ts to serve
# the skill brief at GET /skill.md.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
# Task backend origin: the /v1 API and the task MCP connector (/mcp) with its
# pairing OAuth (/oauth/*, /.well-known/*); see src/shadow/.
API_PUBLIC_URL = "https://api.septena.app"
# Bundle ids accepted as the `aud` of a Sign in with Apple identity token.
APPLE_AUDIENCES = "com.septena.cloud,com.septena.cloud.mac,com.septena.tasks,com.septena.tasks.mac"
# Sync subscription (docs/SYNC_SUBSCRIPTION_SPEC.md §6). "false": the check
# runs and logs `entitlement_would_block`, and nothing is refused. Flip to
# "true" only after mz has a grant row (spec §6, "Grant yourself").
ENTITLEMENT_ENFORCE = "false"
# ADR 0040 rollout. Step 1 accepts signed tokens, step 2 ("true") issues them.
SIGNED_SESSIONS = "false"
# App Store purchases count only from these bundle ids and environments.
# Sandbox stays on for TestFlight and P1 testing; drop it at public launch.
APPLE_IAP_BUNDLE_IDS = "com.septena.tasks"
APPLE_IAP_ENVIRONMENTS = "Production,Sandbox"
# Allowed browser origins for the web client (docs/WEB_CLIENT_SPEC.md §4–§5).
WEB_ALLOWED_ORIGINS = "https://web.septena.app"

# Created via `wrangler kv namespace create <NAME>`; paste returned IDs here.
[[kv_namespaces]]
binding = "STATE"
id = "4066d642849946a5bcdb5523b52a35d5"

[[kv_namespaces]]
binding = "TOKENS"
id = "1b8f0af54763424190a01dcb85109852"

[[kv_namespaces]]
binding = "CLIENTS"
id = "c6550511896e493aa5abd8685e9dd6a1"

# Task backend: one TaskStore Durable Object (SQLite) per user.
[[durable_objects.bindings]]
name = "TASK_STORE"
class_name = "TaskStore"

[[migrations]]
tag = "v1-task-store"
new_sqlite_classes = ["TaskStore"]

# Pending app-pairing codes for the api.septena.app MCP connector: one object
# per code, so approve and the browser's poll see the same state at once (KV
# would serve the poll a cached "pending" for up to a minute).
[[durable_objects.bindings]]
name = "PAIRING"
class_name = "PairingStore"

[[migrations]]
tag = "v2-pairing-store"
new_sqlite_classes = ["PairingStore"]

# Global identity table mapping `provider:subject` (apple:<sub>,
# email:<normalized>, …) to `userId` (ADR 0016, issue #168).
[[durable_objects.bindings]]
name = "ACCOUNT_STORE"
class_name = "AccountStore"

[[migrations]]
tag = "v3-account-store"
new_sqlite_classes = ["AccountStore"]

# Attachment bytes. Create once: wrangler r2 bucket create septena-attachments
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "septena-attachments"

# ---- Secrets (NOT in this file — set via `wrangler secret put`) ----
# SESSION_SIGNING_KEY — 32-byte base64 (openssl rand -base64 32); signs the
#                   task backend's access tokens.
# ADMIN_TOKEN     — optional, 32-byte base64. Enables POST/DELETE
#                   /v1/admin/grants (entitlement grant rows). Unset = 404.
# APNS_KEY        — optional, contents of Apple Push Notifications .p8 key file.
# APNS_KEY_ID     — optional, 10-character APNs Key ID from Apple Developer.
# APNS_TEAM_ID    — optional, 10-character Apple Developer Team ID.
# APNS_BUNDLE_ID  — optional, defaults to "com.septena.tasks".
# APNS_SANDBOX    — optional, "true" forces sandbox host; unset uses per-token flag.
