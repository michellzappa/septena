<?xml version="1.0" encoding="UTF-8"?>
<!--
  Septena brand mark as a custom SF Symbol.

  Seven discs arranged in a regular heptagon, expressed as a single `<path>`
  so the symbol renderer treats it as one monochrome glyph. Artwork is
  sized so the discs extend slightly past the typographic body (like other
  filled SF Symbols do); a tighter fit inside cap/baseline rendered the
  mark too small in the tab bar.

  Provides only the canonical Regular-M variant — Xcode synthesises the
  rest from this glyph and its bracketing Baseline / Capline guides.
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 800 800" width="800" height="800">
  <g id="Notes"/>

  <g id="Guides">
    <line id="Capline-S"  stroke="#27AAE1" stroke-width="0.5" x1="0" y1="100" x2="800" y2="100"/>
    <line id="Baseline-S" stroke="#27AAE1" stroke-width="0.5" x1="0" y1="700" x2="800" y2="700"/>
    <line id="Capline-M"  stroke="#27AAE1" stroke-width="0.5" x1="0" y1="100" x2="800" y2="100"/>
    <line id="Baseline-M" stroke="#27AAE1" stroke-width="0.5" x1="0" y1="700" x2="800" y2="700"/>
    <line id="Capline-L"  stroke="#27AAE1" stroke-width="0.5" x1="0" y1="100" x2="800" y2="100"/>
    <line id="Baseline-L" stroke="#27AAE1" stroke-width="0.5" x1="0" y1="700" x2="800" y2="700"/>
  </g>

  <g id="Symbols">
    <g id="Regular-M">
      <path d="M310,142 a90,90 0 1,0 180,0 a90,90 0 1,0 -180,0 z M523,242 a90,90 0 1,0 180,0 a90,90 0 1,0 -180,0 z M576,476 a90,90 0 1,0 180,0 a90,90 0 1,0 -180,0 z M429,660 a90,90 0 1,0 180,0 a90,90 0 1,0 -180,0 z M191,660 a90,90 0 1,0 180,0 a90,90 0 1,0 -180,0 z M44,476 a90,90 0 1,0 180,0 a90,90 0 1,0 -180,0 z M97,242 a90,90 0 1,0 180,0 a90,90 0 1,0 -180,0 z"/>
    </g>
  </g>
</svg>
