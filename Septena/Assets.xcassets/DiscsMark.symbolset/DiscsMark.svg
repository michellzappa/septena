<?xml version="1.0" encoding="UTF-8"?>
<!--
  Septena brand mark as a custom SF Symbol.

  Seven discs arranged in a regular heptagon, expressed as a single `<path>`
  so the symbol renderer treats it as one monochrome glyph. Artwork sized
  so the discs read at the same visual weight as `arrow.right` /
  `checkmark` in the tab bar (~25% larger than the original fit-inside-
  body version, then a further 10% on top); viewBox is correspondingly
  larger to contain the splay.

  Provides only the canonical Regular-M variant — Xcode synthesises the
  rest from this glyph and its bracketing Baseline / Capline guides.
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 1000 1000" width="1000" height="1000">
  <g id="Notes"/>

  <g id="Guides">
    <line id="Capline-S"  stroke="#27AAE1" stroke-width="0.5" x1="0" y1="200" x2="1000" y2="200"/>
    <line id="Baseline-S" stroke="#27AAE1" stroke-width="0.5" x1="0" y1="800" x2="1000" y2="800"/>
    <line id="Capline-M"  stroke="#27AAE1" stroke-width="0.5" x1="0" y1="200" x2="1000" y2="200"/>
    <line id="Baseline-M" stroke="#27AAE1" stroke-width="0.5" x1="0" y1="800" x2="1000" y2="800"/>
    <line id="Capline-L"  stroke="#27AAE1" stroke-width="0.5" x1="0" y1="200" x2="1000" y2="200"/>
    <line id="Baseline-L" stroke="#27AAE1" stroke-width="0.5" x1="0" y1="800" x2="1000" y2="800"/>
  </g>

  <g id="Symbols">
    <g id="Regular-M">
      <path d="M376.25,143.5 a123.75,123.75 0 1,0 247.5,0 a123.75,123.75 0 1,0 -247.5,0 z M669.125,281 a123.75,123.75 0 1,0 247.5,0 a123.75,123.75 0 1,0 -247.5,0 z M742,602.75 a123.75,123.75 0 1,0 247.5,0 a123.75,123.75 0 1,0 -247.5,0 z M539.875,855.75 a123.75,123.75 0 1,0 247.5,0 a123.75,123.75 0 1,0 -247.5,0 z M212.625,855.75 a123.75,123.75 0 1,0 247.5,0 a123.75,123.75 0 1,0 -247.5,0 z M10.5,602.75 a123.75,123.75 0 1,0 247.5,0 a123.75,123.75 0 1,0 -247.5,0 z M83.375,281 a123.75,123.75 0 1,0 247.5,0 a123.75,123.75 0 1,0 -247.5,0 z"/>
    </g>
  </g>
</svg>
