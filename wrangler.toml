name = "septena-mcp-gateway"
# The Centaur-Labs account. Pinned so a wrangler login with several accounts
# cannot deploy or create resources on the wrong one.
account_id = "50894cc73fc5188e3efb7eb9819c54e9"
main = "src/index.ts"
compatibility_date = "2024-12-15"
compatibility_flags = ["nodejs_compat_v2"]

# Bind the Worker to the custom domains. Keep this above the first [table]:
# below a table header TOML makes it a key of that table and wrangler
# ignores it. Requires:
#   • septena.app DNS on Cloudflare (done)
#   • Zone "Active" in the Cloudflare dashboard
routes = [
  { pattern = "mcp.septena.app", custom_domain = true },
  # Task backend API (/v1). Same Worker so the MCP tools can reach each
  # user's TaskStore directly in a later phase.
  { pattern = "api.septena.app", custom_domain = true },
]

# Retain structured logs (the logEvent JSON lines) so a lapse can be
# investigated after the fact instead of only during a live `wrangler tail`.
# Query in the dashboard (Workers → Observability) or via the API.
[observability]
enabled = true
head_sampling_rate = 1

# Daily prune of dead access-token records (see scheduled handler).
[triggers]
crons = ["0 3 * * *"]

# Allow importing .md files as text modules. Used by src/landing.ts to embed
# the skill brief served at GET / and GET /skill.md without escaping the
# markdown into a TS template literal.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
CK_CONTAINER = "iCloud.com.septena.cloud"
# Flip to "production" once the CloudKit schema is deployed to Production.
# Until then the gateway talks to CloudKit Development, accessible only to
# Apple IDs on the developer team (i.e. you).
CK_ENVIRONMENT = "development"
CK_ZONE = "septena-v1"
PUBLIC_URL = "https://mcp.septena.app"
# Bundle ids accepted as the `aud` of a Sign in with Apple identity token.
APPLE_AUDIENCES = "com.septena.cloud,com.septena.cloud.mac,com.septena.tasks,com.septena.tasks.mac"

# Created via `wrangler kv namespace create <NAME>`; paste returned IDs here.
[[kv_namespaces]]
binding = "STATE"
id = "2ad8a91b6ba54e579d843f5bdf215bf4"

[[kv_namespaces]]
binding = "TOKENS"
id = "d89bf617d013488096dd64be9f826d7e"

[[kv_namespaces]]
binding = "CLIENTS"
id = "8d9200723c194a03ac3e1482f24f173d"

# Task backend: one TaskStore Durable Object (SQLite) per user.
[[durable_objects.bindings]]
name = "TASK_STORE"
class_name = "TaskStore"

[[migrations]]
tag = "v1-task-store"
new_sqlite_classes = ["TaskStore"]

# Attachment bytes. Create once: wrangler r2 bucket create septena-attachments
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "septena-attachments"

# ---- Secrets (NOT in this file — set via `wrangler secret put`) ----
# CK_API_TOKEN    — CloudKit Dashboard → API Tokens; redirect URL must be
#                   https://mcp.septena.app/auth/apple/callback
# TOKEN_ENC_KEY   — 32-byte base64 (openssl rand -base64 32) for AES-GCM
# SESSION_SIGNING_KEY — 32-byte base64 (openssl rand -base64 32); signs the
#                   task backend's access tokens. Separate from TOKEN_ENC_KEY.
