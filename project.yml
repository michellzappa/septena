name: Septena
options:
  bundleIdPrefix: com.septena
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    # MARKETING_VERSION is the deliberate, human-chosen release version
    # (SemVer). Bump it by hand here only when cutting a release — see
    # docs/VERSIONING.md. CURRENT_PROJECT_VERSION (the build number) is NOT set
    # here on purpose: it lives in Config/Base.xcconfig so `scripts/stamp-
    # version.sh` can stamp it from the git commit count at archive time
    # (monotonic, conflict-free across parallel sessions).
    MARKETING_VERSION: "0.7.0"
    DEVELOPMENT_TEAM: $(SEPTENA_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  configs:
    # Debug defaults to `-Onone`, which makes SwiftUI/SwiftData/Observation
    # (all heavily generic) 10–50× slower on-device — the app is unusable
    # in a plain debug build even though Release is fast. Optimize Debug so
    # dev-device runs match Release speed. Trade-off: step-debugging is less
    # precise (locals may read "optimized out", breakpoints can skip inlined
    # frames). For a pure breakpoint session, temporarily set this back to
    # `-Onone` in Xcode's build settings (or revert this line).
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"

targets:
  Septena:
    type: application
    platform: iOS
    sources:
      - path: Septena
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      - path: SeptenaCore
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeptenaWatch
        embed: true
        codeSign: true
      - sdk: FoundationModels.framework
      - target: SeptenaLiveActivitiesExtension
        embed: true
        codeSign: true
      - target: SeptenaWidgets
        embed: true
        codeSign: true
    info:
      path: Septena/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Septena
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - en
          - fr
          - de
          - es
          - pt-BR
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SeptenaSceneDelegate
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - remote-notification
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.septena.cloud
            CFBundleURLSchemes:
              - septena
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSRemindersFullAccessUsageDescription: Septena imports tasks from your Reminders lists into the Inbox.
        NSRemindersUsageDescription: Septena imports tasks from your Reminders lists into the Inbox.
        NSCalendarsFullAccessUsageDescription: Septena shows upcoming events from your calendars on the Week dashboard.
        NSCalendarsUsageDescription: Septena shows upcoming events from your calendars on the Week dashboard.
        NSHealthShareUsageDescription: Septena reads your activity and recovery metrics (steps, exercise, VO2, HRV, resting heart rate) so the Activity tile can show them on the Week dashboard. Data stays on your device.
        NSHealthUpdateUsageDescription: Septena saves your mood check-ins and nutrition entries (meals, macros, water) to HealthKit so they appear in the Health app alongside your other data. Data stays on your device.
        NSPhotoLibraryUsageDescription: Septena attaches photos to your meal entries and shows their thumbnails in your nutrition log. Photos stay on your device.
        NSCameraUsageDescription: Septena uses the camera to photograph your meals so it can read the nutrition label or estimate macros on-device. Photos stay on your device.
        NSFaceIDUsageDescription: Septena uses Face ID to unlock the app when App Lock is turned on, so your private logs stay covered on an unlocked phone.
        WithingsClientID: $(WITHINGS_CLIENT_ID)
        WithingsClientSecret: $(WITHINGS_CLIENT_SECRET)
        CloudKitWebAPIToken: $(CLOUDKIT_WEB_API_TOKEN)
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.cloud
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconRed AppIconOrange AppIconYellow AppIconGreen AppIconCyan AppIconBlue AppIconPurple"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Septena/Septena.entitlements

  SeptenaMac:
    type: application
    platform: macOS
    sources:
      - path: Septena
        excludes:
          - "**/.DS_Store"
          - Widgets
          - "**/*.entitlements"
      - path: SeptenaCore
        excludes:
          - "**/.DS_Store"
      # Standalone icns generated with iconutil — Xcode's asset-catalog
      # compiler on this SDK silently drops Mac icon slots above 128px when
      # they share content with other slots. Bundling a pre-built icns
      # sidesteps that entirely.
      - path: Septena/AppIcon.icns
        type: file
    info:
      path: Septena/Info-Mac.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Septena
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - en
          - fr
          - de
          - es
          - pt-BR
        CFBundleIconFile: AppIcon
        NSRemindersFullAccessUsageDescription: Septena imports tasks from your Reminders lists into the Inbox.
        NSRemindersUsageDescription: Septena imports tasks from your Reminders lists into the Inbox.
        NSCalendarsFullAccessUsageDescription: Septena shows upcoming events from your calendars on the Week dashboard.
        NSCalendarsUsageDescription: Septena shows upcoming events from your calendars on the Week dashboard.
        NSHealthShareUsageDescription: Septena reads your activity and recovery metrics (steps, exercise, VO2, HRV, resting heart rate) so the Activity tile can show them on the Week dashboard. Data stays on your device.
        NSHealthUpdateUsageDescription: Septena saves your mood check-ins and nutrition entries (meals, macros, water) to HealthKit so they appear in the Health app alongside your other data. Data stays on your device.
        NSPhotoLibraryUsageDescription: Septena attaches photos to your meal entries and shows their thumbnails in your nutrition log. Photos stay on your device.
        NSCameraUsageDescription: Septena uses the camera to photograph your meals so it can read the nutrition label or estimate macros on-device. Photos stay on your device.
        NSFaceIDUsageDescription: Septena uses Face ID to unlock the app when App Lock is turned on, so your private logs stay covered on an unlocked phone.
        WithingsClientID: $(WITHINGS_CLIENT_ID)
        WithingsClientSecret: $(WITHINGS_CLIENT_SECRET)
        CloudKitWebAPIToken: $(CLOUDKIT_WEB_API_TOKEN)
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        # Target is named SeptenaMac (to disambiguate from the iOS target), but
        # the shipped app is just "Septena" — without this the built bundle is
        # SeptenaMac.app, which is what kept "renaming" the app.
        PRODUCT_NAME: Septena
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.cloud.mac
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Septena/SeptenaMac.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: FoundationModels.framework

  # Septask — the focused task app over the same private task data
  # (docs/SEPTASK.md). Same SeptenaCore sources compiled in, different
  # composition root: the SEPTASK compilation condition flips
  # RuntimeProfile.current to .tasksOnly so SeptenaServices binds only the
  # task/area/project mutators and never touches life-OS subsystems or
  # third-party provider stores. Septask.entitlements is hand-maintained
  # (same iCloud container/zone as Septena — CloudKit is the convergence
  # point between the two apps; the SwiftData mirrors stay separate).
  Septask:
    type: application
    platform: iOS
    sources:
      - path: Septask
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      - path: SeptenaCore
        excludes:
          - "**/.DS_Store"
          # Next-feed composition reaches UP into shell types
          # (NextSuggestionsModel in Shell/Dashboard) — fine when core+shell
          # share a target, unresolvable here. Next is out of Septask's
          # surface, so both the feed and its one core dependent are cut;
          # the call site in SeptenaServices is `#if !SEPTASK`-gated.
          - NextFeed.swift
          - WatchSnapshotPublisher.swift
      # P1 (docs/SEPTASK.md): the real task UI, by source inclusion — the same
      # files the full app compiles, never copies. TasksDestinationView is the
      # full-app drawer adapter and stays out. Cross-domain spots inside these
      # files are `#if !SEPTASK`-gated (Task Settings entry, NextView route).
      - path: Septena/Shell/Tasks
        excludes:
          - TasksDestinationView.swift
      - path: Septena/Shell/Sidebar
      - path: Septena/Shell/UI
        excludes:
          # Training-effort glyph — reaches into Sections/Training; unused by
          # any task surface.
          - IntensityGlyph.swift
          # Dashboard tile card — reaches into homepage domain types; unused
          # by any task surface.
          - ModuleTile.swift
      - path: Septena/App/ContentView.swift
      - path: Septena/App/NavigationState.swift
      - path: Septena/App/ShortcutAction.swift
      - path: Septena/App/SeptenaTab.swift
      - path: Septena/App/OpenNewTaskRouting.swift
      - path: Septena/Shell/Settings/SettingsKeys.swift
      # Supporter-finish constants used by LogCommit's celebration variant.
      - path: Septena/Shell/Settings/SeptenaPlus.swift
      # P3: the AI/Claude pane + gateway detail (SettingsView deep links
      # inside are #if !SEPTASK-gated), the macOS local MCP pane, and the
      # hex→Color helper the shared palette picker rides.
      - path: Septena/Shell/Settings/AISettingsPane.swift
      - path: Septena/Shell/Settings/ClaudeGatewayDetail.swift
      - path: Septena/Shell/Settings/LocalMCPSettingsPane.swift
      - path: Septena/Shell/Settings/SettingsChrome.swift
      - path: Septena/Shell/Settings/SettingsColor.swift
      - path: Septena/Shell/Settings/SettingsStore.swift
      - path: Septena/Shell/Settings/ConnectedAppsDetails.swift
      # Shared string catalog — localizes the whole reused task UI (already
      # translated) and collects Septask-only strings for translation.
      - path: Septena/Localizable.xcstrings
      - path: Septena/Shell/Capture/AddInfo/AddInfoSection.swift
      - path: Septena/Shell/Capture/AddInfo/AddInfoRouter.swift
      - path: Septena/Shell/Capture/AddInfo/AddInfoRow.swift
      - path: Septena/Shell/Capture/QuickFindView.swift
      # Drawer chrome: task views use its shared plumbing (`macSheetFrame`,
      # the `usesPushNavigation` / `rowHInset` environment keys).
      - path: Septena/Shell/Sections/SectionDrawer.swift
      - path: Septena/Shell/Sections/TimeTravelSheet.swift
      - path: Septena/Shell/Intelligence/OnDeviceReasoningProvider.swift
      - path: Septena/Shell/Intelligence/OnDeviceAI.swift
      - path: Septena/Shell/Intelligence/Components/FlowLayout.swift
    info:
      path: Septask/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Septask
        CFBundleLocalizations:
          - en
          - fr
          - de
          - es
          - pt-BR
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Scene lifecycle so Home Screen Quick Actions land: the cold-launch
        # item rides UIScene.ConnectionOptions, delivered to SeptaskSceneDelegate
        # (SeptaskQuickActions.swift). Without an explicit delegate class iOS
        # uses a no-op default and drops the tap. Mirrors the full app.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SeptaskSceneDelegate
        # Always-present icon long-press actions. Types match
        # ShortcutAction's raw values.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.septena.app.newtask
            UIApplicationShortcutItemTitle: Quick Add
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeAdd
          - UIApplicationShortcutItemType: com.septena.app.today
            UIApplicationShortcutItemTitle: Today
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeDate
        UIBackgroundModes:
          - remote-notification
        # The compiled task UI includes the Reminders inbox and the Today
        # calendar strip (EventKit) — access requests crash without these.
        NSRemindersFullAccessUsageDescription: Septask imports tasks from your Reminders lists into the Inbox.
        NSRemindersUsageDescription: Septask imports tasks from your Reminders lists into the Inbox.
        NSCalendarsFullAccessUsageDescription: Septask shows today's calendar events above your task list.
        NSCalendarsUsageDescription: Septask shows today's calendar events above your task list.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.tasks
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Septask/Septask.entitlements
      configs:
        # DEBUG must be restated: overriding SWIFT_ACTIVE_COMPILATION_CONDITIONS
        # replaces Xcode's Debug default rather than appending to it, and
        # DemoSeedMode gates on `#if DEBUG`.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG SEPTASK"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "SEPTASK"

  # Native macOS sibling, following the Septena / SeptenaMac pattern (separate
  # target, not a multiplatform destination). Same source list as Septask —
  # keep the two in lockstep when adding P-phase inclusions.
  SeptaskMac:
    type: application
    platform: macOS
    sources:
      - path: Septask
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      - path: SeptenaCore
        excludes:
          - "**/.DS_Store"
          - NextFeed.swift
          - WatchSnapshotPublisher.swift
      - path: Septena/Shell/Tasks
        excludes:
          - TasksDestinationView.swift
      - path: Septena/Shell/Sidebar
      - path: Septena/Shell/UI
        excludes:
          - IntensityGlyph.swift
          - ModuleTile.swift
      - path: Septena/App/ContentView.swift
      - path: Septena/App/NavigationState.swift
      - path: Septena/App/ShortcutAction.swift
      - path: Septena/App/SeptenaTab.swift
      - path: Septena/App/OpenNewTaskRouting.swift
      - path: Septena/Shell/Settings/SettingsKeys.swift
      - path: Septena/Shell/Settings/SeptenaPlus.swift
      - path: Septena/Shell/Settings/AISettingsPane.swift
      - path: Septena/Shell/Settings/ClaudeGatewayDetail.swift
      - path: Septena/Shell/Settings/LocalMCPSettingsPane.swift
      - path: Septena/Shell/Settings/SettingsChrome.swift
      - path: Septena/Shell/Settings/SettingsColor.swift
      - path: Septena/Shell/Settings/SettingsStore.swift
      - path: Septena/Shell/Settings/ConnectedAppsDetails.swift
      # Shared string catalog — localizes the whole reused task UI (already
      # translated) and collects Septask-only strings for translation.
      - path: Septena/Localizable.xcstrings
      - path: Septena/Shell/Capture/AddInfo/AddInfoSection.swift
      - path: Septena/Shell/Capture/AddInfo/AddInfoRouter.swift
      - path: Septena/Shell/Capture/AddInfo/AddInfoRow.swift
      - path: Septena/Shell/Capture/QuickFindView.swift
      - path: Septena/Shell/Sections/SectionDrawer.swift
      - path: Septena/Shell/Sections/TimeTravelSheet.swift
      - path: Septena/Shell/Intelligence/OnDeviceReasoningProvider.swift
      - path: Septena/Shell/Intelligence/OnDeviceAI.swift
      - path: Septena/Shell/Intelligence/Components/FlowLayout.swift
      # Standalone icns generated from the same disc geometry + Septena's
      # icns alpha mask (identical corner rounding) — see the SeptenaMac
      # comment for why a pre-built icns and not the asset catalog.
      - path: Septask/AppIcon.icns
        type: file
    dependencies:
      - sdk: FoundationModels.framework
    info:
      path: Septask/Info-Mac.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Septask
        CFBundleLocalizations:
          - en
          - fr
          - de
          - es
          - pt-BR
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconFile: AppIcon
        NSRemindersFullAccessUsageDescription: Septask imports tasks from your Reminders lists into the Inbox.
        NSRemindersUsageDescription: Septask imports tasks from your Reminders lists into the Inbox.
        NSCalendarsFullAccessUsageDescription: Septask shows today's calendar events above your task list.
        NSCalendarsUsageDescription: Septask shows today's calendar events above your task list.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        # Target name disambiguates from the iOS target; the shipped bundle
        # is Septask.app (same pattern as SeptenaMac → Septena.app).
        PRODUCT_NAME: Septask
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.tasks.mac
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Septask/SeptaskMac.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG SEPTASK"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "SEPTASK"

  SeptenaWatch:
    type: application
    platform: watchOS
    sources:
      - path: SeptenaWatch
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      # Shared "Next" wire/membership types compiled straight into the watch
      # target (no shared framework), so the phone and watch can never disagree
      # about Next's shape. These are single-sourced in SeptenaCore — see the
      # header in NextWire.swift / NextBlocks.swift. NextWire needs DayBucket.
      - path: SeptenaCore/NextWire.swift
      - path: SeptenaCore/DayBucket.swift
      - path: SeptenaCore/NextBlocks.swift
      # Quick-log dispatch table for actionable suggestions (caffeine/cannabis/
      # mood) — single-sourced like NextBlocks so the wrist write can't drift.
      - path: SeptenaCore/SuggestionBlocks.swift
      # Generic container math for intake trackers — the wrist + menu renders
      # each wire kind's choices with the same logic as the phone.
      - path: SeptenaCore/ConsumableContainer.swift
      # Canonical mood word grid, shared with the phone's MoodCatalog so the
      # watch's 3×3 emotion picker can't diverge.
      - path: SeptenaCore/MoodVocabulary.swift
      # The fasting state machine, so the watch decides fed-vs-fasting itself at
      # its own `now` (FastingComplication.liveState) — the morph then appears
      # overnight and rolls over at midnight without the phone republishing.
      - path: SeptenaCore/Fasting.swift
      # Time-of-day sky: the physical atmosphere renderer + the no-permission
      # solar-elevation source, compiled straight into the watch (the same files
      # the phone's SkyTopWash and the widget's dial use) so the wrist's sky
      # can't drift from the phone's. Pure Foundation/simd — no DayClock/UIKit.
      - path: Septena/Shell/UI/SkyAtmosphere.swift
      - path: Septena/Shell/UI/SolarClock.swift
      # Shared ring renderer + per-metric styling, compiled into both the watch
      # app (the in-app macro / training summary pages) and the complication
      # extension (the rings on the watch face) so the two can't drift.
      - path: SeptenaWatchComplication/ComplicationRingsView.swift
      - path: SeptenaWatchComplication/RingStyles.swift
      # Vendored WolfActivityRing (MIT) — the Apple-style activity ring that
      # renders the over-100% lap via color contrast (works in the complication).
      - path: SeptenaWatchComplication/WolfActivityRing.swift
    dependencies:
      - target: SeptenaWatchComplication
        embed: true
        codeSign: true
    info:
      path: SeptenaWatch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Septena
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.septena.cloud
        # Tap a training Live Activity card on the wrist → open the Watch app
        # (routes to the training summary via `NextWatchView.onOpenURL`).
        WKSupportsLiveActivityLaunchAttributeTypes:
          - TrainingActivityAttributes
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.cloud.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SeptenaWatch/SeptenaWatch.entitlements

  SeptenaWatchComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: SeptenaWatchComplication
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      - path: SeptenaWatch/SharedComplicationData.swift
      # Canonical bucket labels (DayBucket.label) so the complication renders
      # the same localized "Morning"/"Afternoon"/"Evening" as every other
      # surface instead of capitalizing a raw string.
      - path: SeptenaCore/DayBucket.swift
      # The fasting state machine — the complication face re-decides fed-vs-fasting
      # per timeline entry (FastingComplication.liveState) so the morph steps over
      # the fast and across midnight without a provider reload or a phone republish.
      - path: SeptenaCore/Fasting.swift
    info:
      path: SeptenaWatchComplication/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.cloud.watchkitapp.next
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SeptenaWatchComplication/SeptenaWatchComplication.entitlements

  SeptenaLiveActivitiesExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SeptenaLiveActivitiesExtension
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      - path: SeptenaCore/TrainingLiveActivity.swift
    info:
      path: SeptenaLiveActivitiesExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.cloud.liveactivities
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SeptenaLiveActivitiesExtension/SeptenaLiveActivitiesExtension.entitlements

  SeptenaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SeptenaWidgets
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      # Shared "Next" wire types compiled straight into the widget (same pattern
      # as the watch target). The widget renders NextItem snapshots, so it needs
      # NextWire + DayBucket. NextWire needs DayBucket.
      - path: SeptenaCore/NextWire.swift
      - path: SeptenaCore/DayBucket.swift
      # Time-wheel ("Rhythm") widget: the shared wire blob + the dial view it
      # renders. TimeOfDayWheel needs Theme (token bag) and AdaptiveColor (the
      # hex→Color resolver, split out of SectionTheme so the widget needn't pull
      # in the whole theme runtime). SolarClock gives the dial its night arc
      # on-device (no location, no payload field).
      - path: SeptenaCore/RhythmWire.swift
      - path: SeptenaCore/AdaptiveColor.swift
      - path: SeptenaCore/HomepageDomain.swift
      - path: SeptenaCore/TileWidgetWire.swift
      - path: SeptenaCore/TileWidgetSnapshotStore.swift
      - path: SeptenaCore/MacroWidgetWire.swift
      - path: SeptenaCore/MacroWidgetSnapshotStore.swift
      - path: SeptenaCore/TasksWidgetWire.swift
      - path: SeptenaCore/TasksWidgetSnapshotStore.swift
      - path: SeptenaCore/HeatmapLevels.swift
      - path: SeptenaCore/WakingDay.swift
      - path: Septena/Shell/UI/SectionGlyph.swift
      - path: Septena/Shell/UI/ModuleTile.swift
      - path: Septena/Shell/UI/ConsistencyHeatmap.swift
      - path: Septena/Shell/Dashboard/HeatmapTileRow.swift
      - path: Septena/Shell/UI/TimeOfDayWheel.swift
      - path: Septena/Shell/UI/Theme.swift
      - path: Septena/Shell/UI/SolarClock.swift
      # Control Center "Add Task" — intent type for ControlWidgetButton.
      - path: Septena/App/Intents/OpenNewTaskControlIntent.swift
    info:
      path: SeptenaWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.cloud.widgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SeptenaWidgets/SeptenaWidgets.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_EXTENSION

  # Hermetic unit tests for pure SeptenaCore logic. SeptenaCore is NOT a
  # framework — it's source compiled into each app target — so there's nothing
  # to @testable import. Instead this standalone macOS test bundle recompiles
  # the self-contained, Foundation-only logic files directly. No host app, no
  # simulator, no SwiftData/CloudKit — runs in milliseconds.
  # INVARIANT: only add files here that import nothing beyond Foundation, or the
  # bundle won't link. Files with SwiftData/SwiftUI deps don't belong.
  SeptenaCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SeptenaCoreTests
        excludes:
          - "**/.DS_Store"
      - path: SeptenaCore/Fasting.swift
      - path: SeptenaCore/DateParser.swift
      - path: SeptenaCore/Logging.swift
      - path: SeptenaCore/ConsumableContainer.swift
      - path: SeptenaCore/SuggestionBlocks.swift
      - path: SeptenaCore/IntakeModel.swift
      - path: SeptenaCore/GutSymptomMigrationMap.swift
      - path: SeptenaCore/ThingsImport/ThingsImportModels.swift
      - path: SeptenaCore/ThingsImport/ThingsDateDecoder.swift
      - path: SeptenaCore/ThingsImport/ThingsSQLiteReader.swift
      - path: SeptenaCore/ThingsImport/ThingsImportParser.swift
      - path: SeptenaCore/ThingsImport/ThingsImportMapping.swift
      - path: SeptenaCore/ThingsImport/ThingsImportScratchpad.swift
      - path: SeptenaCore/ThingsImport/ThingsToSeptenaMapper.swift
      - path: SeptenaCore/WakingDay.swift
      - path: SeptenaCore/TrainingSessionSpans.swift
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.cloud.coretests

  SeptenaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SeptenaUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Septena
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.cloud.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Septena

  # Mac marketing-screenshot capture (App Store viz pipeline, appstore/).
  SeptenaMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: SeptenaMacUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeptenaMac
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.cloud.macuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SeptenaMac

  # Septask marketing-screenshot capture (App Store viz pipeline, appstore/,
  # SEPTENA_APP=septask). Task-only sidebar navigation; see the test file.
  SeptaskUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SeptaskUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Septask
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.tasks.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Septask

  SeptaskMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: SeptaskMacUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeptaskMac
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.tasks.macuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SeptaskMac

schemes:
  Septena:
    build:
      targets:
        Septena: all
    run:
      config: Debug
      # Local StoreKit testing: the support purchases resolve against this
      # config file (no App Store Connect needed). See Config/Septena.storekit.
      storeKitConfiguration: Config/Septena.storekit
    test:
      config: Debug
      targets:
        - SeptenaUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Septask:
    build:
      targets:
        Septask: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SeptaskUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  SeptaskMac:
    build:
      targets:
        SeptaskMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SeptaskMacUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  SeptenaWatch:
    build:
      targets:
        SeptenaWatch: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  SeptenaMac:
    build:
      targets:
        SeptenaMac: all
    run:
      config: Debug
      storeKitConfiguration: Config/Septena.storekit
    test:
      config: Debug
      targets:
        - SeptenaMacUITests

  # Standalone unit-test scheme. Runs fast (no host app):
  #   xcodebuild test -scheme SeptenaCoreTests -destination 'platform=macOS'
  SeptenaCoreTests:
    build:
      targets:
        SeptenaCoreTests: all
    test:
      config: Debug
      targets:
        - SeptenaCoreTests
