name: Engage
options:
  bundleIdPrefix: com.engage
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_ENGAGE_CONVEX_URL: "$(ENGAGE_CONVEX_URL)"
    INFOPLIST_KEY_ENGAGE_CONVEX_KEY: "$(ENGAGE_CONVEX_KEY)"
    GCC_PREPROCESSOR_DEFINITIONS: "ENGAGE_CONVEX_URL=$(ENGAGE_CONVEX_URL)"

packages:
  Convex:
    url: https://github.com/get-convex/convex-swift
    from: "1.8.0"
  swift-algorithms:
    url: https://github.com/apple/swift-algorithms
    from: "1.2.0"

targets:
  Engage:
    type: application
    platform: iOS
    sources:
      - path: Engage
        excludes:
          - "**/.DS_Store"
      - path: EngageCore
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: Convex
        product: Convex
      - package: swift-algorithms
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.engage.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Engage

  EngageMac:
    type: application
    platform: macOS
    sources:
      - path: Engage
        excludes:
          - "**/.DS_Store"
          - Widgets
      - path: EngageCore
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: Convex
        product: Convex
      - package: swift-algorithms
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.engage.mac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Engage

schemes:
  Engage:
    build:
      targets:
        Engage: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  EngageMac:
    build:
      targets:
        EngageMac: all
    run:
      config: Debug
