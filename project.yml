name: Septena
options:
  bundleIdPrefix: com.septena
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

targets:
  Septena:
    type: application
    platform: iOS
    sources:
      - path: Septena
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      - path: SeptenaCore
        excludes:
          - "**/.DS_Store"
    info:
      path: Septena/Info.plist
      properties:
        CFBundleDisplayName: Septena
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSRemindersFullAccessUsageDescription: Septena imports tasks from your Reminders lists into the Inbox.
        NSRemindersUsageDescription: Septena imports tasks from your Reminders lists into the Inbox.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Septena/Septena.entitlements

  SeptenaMac:
    type: application
    platform: macOS
    sources:
      - path: Septena
        excludes:
          - "**/.DS_Store"
          - Widgets
          - "**/*.entitlements"
      - path: SeptenaCore
        excludes:
          - "**/.DS_Store"
      # Standalone icns generated with iconutil — Xcode's asset-catalog
      # compiler on this SDK silently drops Mac icon slots above 128px when
      # they share content with other slots. Bundling a pre-built icns
      # sidesteps that entirely.
      - path: Septena/AppIcon.icns
        type: file
    info:
      path: Septena/Info-Mac.plist
      properties:
        CFBundleDisplayName: Septena
        CFBundleIconFile: AppIcon
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSRemindersFullAccessUsageDescription: Septena imports tasks from your Reminders lists into the Inbox.
        NSRemindersUsageDescription: Septena imports tasks from your Reminders lists into the Inbox.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.mac
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Septena/SeptenaMac.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  Septena:
    build:
      targets:
        Septena: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  SeptenaMac:
    build:
      targets:
        SeptenaMac: all
    run:
      config: Debug
