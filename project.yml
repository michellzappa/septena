name: Septena
options:
  bundleIdPrefix: com.septena
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  defaultConfig: Release

# Sparkle is linked only by the direct-distribution macOS target below.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.2

settings:
  base:
    SWIFT_VERSION: "5.10"
    # `targeted` (not `minimal`): the compiler checks every type that has
    # actually adopted concurrency — async/await, actors, @MainActor — which is
    # exactly where a real data race can live, and the tree builds clean under
    # it. `complete` is NOT viable yet: SwiftData's `#Predicate` key paths
    # aren't Sendable on Swift 5.10, which buries the signal under ~1600
    # spurious warnings, and the type-checker crashes outright on the largest
    # view bodies. Revisit when those files are broken up and we move to Swift 6.
    SWIFT_STRICT_CONCURRENCY: targeted
    # MARKETING_VERSION is the deliberate, human-chosen release version
    # (SemVer). Bump it by hand here only when cutting a release — see
    # docs/VERSIONING.md. CURRENT_PROJECT_VERSION (the build number) is NOT set
    # here on purpose: it lives in Config/Base.xcconfig so `scripts/stamp-
    # version.sh` can stamp it from the git commit count at archive time
    # (monotonic, conflict-free across parallel sessions).
    MARKETING_VERSION: "0.7.0"
    DEVELOPMENT_TEAM: $(SEPTENA_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  configs:
    # Debug defaults to `-Onone`, which makes SwiftUI/SwiftData/Observation
    # (all heavily generic) 10–50× slower on-device — the app is unusable
    # in a plain debug build even though Release is fast. Optimize Debug so
    # dev-device runs match Release speed. Trade-off: step-debugging is less
    # precise (locals may read "optimized out", breakpoints can skip inlined
    # frames). For a pure breakpoint session, temporarily set this back to
    # `-Onone` in Xcode's build settings (or revert this line).
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"

targets:
  # Septask — the focused task app over the same private task data
  # (docs/SEPTASK.md). Same SeptenaCore sources compiled in, different
  # composition root: the SEPTASK compilation condition flips
  # RuntimeProfile.current to .tasksOnly so SeptenaServices binds only the
  # task/area/project mutators and never touches life-OS subsystems or
  # third-party provider stores. Septask.entitlements is hand-maintained
  # (same iCloud container/zone as Septena — CloudKit is the convergence
  # point between the two apps; the SwiftData mirrors stay separate).
  Septask:
    type: application
    platform: iOS
    sources:
      - path: Septask
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      - path: SeptenaCore
        excludes:
          - "**/.DS_Store"
      - path: Septena/Shell/Tasks
      - path: Septena/Shell/Sidebar
      - path: Septena/Shell/UI
      - path: Septena/App/ContentView.swift
      - path: Septena/App/NavigationState.swift
      - path: Septena/App/ShortcutAction.swift
      - path: Septena/App/SeptenaTab.swift
      - path: Septena/App/OpenNewTaskRouting.swift
      - path: Septena/Shell/Settings/SettingsKeys.swift
      # Supporter-finish constants used by LogCommit's celebration variant.
      - path: Septena/Shell/Settings/SeptenaPlus.swift
      # P3: the AI/Claude pane (SettingsView deep links and the hosted
      # gateway row inside are #if !SEPTASK-gated; Septask's Claude row opens
      # the task backend pane), and the hex→Color
      # helper the shared palette picker rides.
      - path: Septena/Shell/Settings/AISettingsPane.swift
      - path: Septena/Shell/Settings/SettingsChrome.swift
      - path: Septena/Shell/Settings/SettingsColor.swift
      - path: Septena/Shell/Settings/SettingsStore.swift
      - path: Septena/Shell/Settings/ConnectedAppsDetails.swift
      # Shared string catalog — localizes the whole reused task UI (already
      # translated) and collects Septask-only strings for translation.
      - path: Septena/Localizable.xcstrings
      - path: Septena/Shell/Capture/AddInfo/AddInfoSection.swift
      - path: Septena/Shell/Capture/AddInfo/AddInfoRouter.swift
      - path: Septena/Shell/Capture/AddInfo/AddInfoRow.swift
      - path: Septena/Shell/Capture/QuickFindView.swift
      # Drawer chrome: task views use its shared plumbing (`macSheetFrame`,
      # the `usesPushNavigation` / `rowHInset` environment keys).
      - path: Septena/Shell/Sections/SectionDrawer.swift
      - path: Septena/Shell/Sections/TimeTravelSheet.swift
      - path: Septena/Shell/Intelligence/OnDeviceReasoningProvider.swift
      - path: Septena/Shell/Intelligence/OnDeviceAI.swift
      - path: Septena/Shell/Intelligence/Components/FlowLayout.swift
      # Shell/Dashboard files are included by file, never by folder — the
      # rest of Shell/Dashboard reaches into surfaces Septask doesn't compile.
      # The Next feed's files (NextItemsSection, NextSuggestionsSection, and
      # the mood / nutrition suggestion destinations) left with Septask's
      # Next page on 2026-11-19 (life-OS content, not tasks). The last one,
      # ClaudeReconnectCue, left with the hosted-gateway connection, so
      # Septask now compiles no Shell/Dashboard file.
    dependencies:
      - target: SeptaskShare
        embed: true
        codeSign: true
      # ⛔️ WATCH_EMBED_DISABLED — TEMPORARY, MUST BE RESTORED BEFORE ANY RELEASE.
      # Uncommented = the Septask app embeds SeptaskWatch. While it's commented out the
      # iOS scheme neither builds nor needs a watchOS runtime, which is the only
      # way to run Septask on device when the installed watchOS simulator runtimes
      # don't match the SDK this Xcode ships. Nothing else changes.
      # Re-enable: delete the three '#' below, then `xcodegen generate`.
      # An archive/upload made in this state SHIPS WITHOUT THE WATCH APP.
      #- target: SeptaskWatch
      #  embed: true
      #  codeSign: true
      # MealPhotoModelAnalyzer (meal-photo macro estimation) imports
      # FoundationModels — same dependency the other three app targets carry.
      - sdk: FoundationModels.framework
    info:
      path: Septask/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Septena
        CFBundleName: Septena
        CFBundleLocalizations:
          - en
          - fr
          - de
          - es
          - pt-BR
        ITSAppUsesNonExemptEncryption: false
        # The app glyph, small and subtle, centered on the system background
        # (white / black). Both are Septask/Assets.xcassets assets with light
        # and dark variants; the monochrome compass glyph PDFs are generated
        # by scripts/render-launch-glyph.swift (#82).
        UILaunchScreen:
          UIImageName: LaunchGlyph
          UIColorName: LaunchBackground
        # Scene lifecycle so Home Screen Quick Actions land: the cold-launch
        # item rides UIScene.ConnectionOptions, delivered to SeptaskSceneDelegate
        # (SeptaskQuickActions.swift). Without an explicit delegate class iOS
        # uses a no-op default and drops the tap. Mirrors the full app.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SeptaskSceneDelegate
        UIApplicationSupportsIndirectInputEvents: true
        # Always-present icon long-press actions. Types match
        # ShortcutAction's raw values.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.septena.app.newtask
            UIApplicationShortcutItemTitle: Quick Add
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeAdd
          - UIApplicationShortcutItemType: com.septena.app.today
            UIApplicationShortcutItemTitle: Today
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeDate
        # No UIBackgroundModes: Septask registers for no push (CloudKit-free,
        # and the backend's silent push is not built yet).
        # The compiled task UI includes the Reminders inbox and the Today
        # calendar strip (EventKit) — access requests crash without these.
        NSRemindersFullAccessUsageDescription: Septena imports tasks from your Reminders lists into the Inbox.
        NSRemindersUsageDescription: Septena imports tasks from your Reminders lists into the Inbox.
        NSCalendarsFullAccessUsageDescription: Septena shows today's calendar events above your task list.
        NSCalendarsUsageDescription: Septena shows today's calendar events above your task list.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_NAME: Septena
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.tasks
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        # No global accent: controls, toggles, selection and menus use the
        # platform accent (the user's System Settings accent on macOS).
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Septask/Septask.entitlements
      configs:
        # DEBUG must be restated: overriding SWIFT_ACTIVE_COMPILATION_CONDITIONS
        # replaces Xcode's Debug default rather than appending to it, and
        # DemoSeedMode gates on `#if DEBUG`.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG SEPTASK"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "SEPTASK"

  SeptaskShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension/ShareViewController.swift
      - path: ShareExtension/PrivacyInfo.xcprivacy
      - path: SeptenaCore/SharedTaskCapture.swift
    info:
      path: ShareExtension/SeptaskShare-Info.plist
      properties:
        CFBundleDisplayName: Septena
        CFBundleName: Septena
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.tasks.share
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ShareExtension/SeptaskShare.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "SHARE_EXTENSION SHARE_DESTINATION_SEPTASK"

  # Native macOS sibling, following the Septena / SeptenaMac pattern (separate
  # target, not a multiplatform destination). Same source list as Septask —
  # keep the two in lockstep when adding P-phase inclusions.
  SeptaskMac:
    type: application
    platform: macOS
    sources:
      - path: Septask
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      - path: SeptenaCore
        excludes:
          - "**/.DS_Store"
      - path: Septena/Shell/Tasks
      - path: Septena/Shell/Sidebar
      - path: Septena/Shell/UI
      - path: Septena/App/ContentView.swift
      - path: Septena/App/NavigationState.swift
      - path: Septena/App/ShortcutAction.swift
      - path: Septena/App/SeptenaTab.swift
      - path: Septena/App/OpenNewTaskRouting.swift
      - path: Septena/Shell/Settings/SettingsKeys.swift
      - path: Septena/Shell/Settings/SeptenaPlus.swift
      - path: Septena/Shell/Settings/AISettingsPane.swift
      - path: Septena/Shell/Settings/SettingsChrome.swift
      - path: Septena/Shell/Settings/SettingsColor.swift
      - path: Septena/Shell/Settings/SettingsStore.swift
      - path: Septena/Shell/Settings/ConnectedAppsDetails.swift
      # Shared string catalog — localizes the whole reused task UI (already
      # translated) and collects Septask-only strings for translation.
      - path: Septena/Localizable.xcstrings
      - path: Septena/Shell/Capture/AddInfo/AddInfoSection.swift
      - path: Septena/Shell/Capture/AddInfo/AddInfoRouter.swift
      - path: Septena/Shell/Capture/AddInfo/AddInfoRow.swift
      - path: Septena/Shell/Capture/QuickFindView.swift
      - path: Septena/Shell/Sections/SectionDrawer.swift
      - path: Septena/Shell/Sections/TimeTravelSheet.swift
      - path: Septena/Shell/Intelligence/OnDeviceReasoningProvider.swift
      - path: Septena/Shell/Intelligence/OnDeviceAI.swift
      - path: Septena/Shell/Intelligence/Components/FlowLayout.swift
      # Standalone icns generated from the same disc geometry + Septena's
      # icns alpha mask (identical corner rounding) — see the SeptenaMac
      # comment for why a pre-built icns and not the asset catalog.
      - path: Septask/AppIcon.icns
        type: file
    dependencies:
      - sdk: FoundationModels.framework
      - package: Sparkle
    info:
      path: Septask/Info-Mac.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Septena
        CFBundleName: Septena
        CFBundleLocalizations:
          - en
          - fr
          - de
          - es
          - pt-BR
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconFile: AppIcon
        SUFeedURL: https://updates.centaur-labs.io/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        NSRemindersFullAccessUsageDescription: Septena imports tasks from your Reminders lists into the Inbox.
        NSRemindersUsageDescription: Septena imports tasks from your Reminders lists into the Inbox.
        NSCalendarsFullAccessUsageDescription: Septena shows today's calendar events above your task list.
        NSCalendarsUsageDescription: Septena shows today's calendar events above your task list.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        # Target name stays `SeptaskMac` internally; the shipped app bundle
        # is `Septena.app` (ADR 0007).
        PRODUCT_NAME: Septena
        # Same bundle ID as iOS: one App Store record per product, one purchase
        # on both platforms (ADR 0007). Was com.septena.tasks.mac until 2026-11-19.
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.tasks
        # No global accent: controls, toggles, selection and menus use the
        # platform accent (the user's System Settings accent on macOS).
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Septask/SeptaskMac.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG SEPTASK"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "SEPTASK"

  SeptaskWatch:
    type: application
    platform: watchOS
    sources:
      - path: SeptaskWatch
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      - path: SeptenaCore/TasksWatchWire.swift
      # The canonical recurrence math, so a wrist completion generates exactly
      # the date and record id the phone would (TasksWatchRecurrence forwards
      # to it). Pure Foundation — no SwiftData, no UI.
      - path: SeptenaCore/DateParser.swift
    dependencies:
      - target: SeptaskWatchComplication
        embed: true
        codeSign: true
    info:
      path: SeptaskWatch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Septena
        CFBundleName: Septena
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.septena.tasks
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_NAME: Septena
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.tasks.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SeptaskWatch/SeptaskWatch.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG SEPTASK"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "SEPTASK"

  SeptaskWatchComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: SeptaskWatchComplication
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      - path: SeptaskWatch/TasksTodayComplicationData.swift
    info:
      path: SeptaskWatchComplication/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Septena
        CFBundleName: Septena
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.tasks.watchkitapp.today
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SeptaskWatchComplication/SeptaskWatchComplication.entitlements

  # Hermetic unit tests for pure SeptenaCore logic. SeptenaCore is NOT a
  # framework — it's source compiled into each app target — so there's nothing
  # to @testable import. Instead this standalone macOS test bundle recompiles
  # the self-contained, Foundation-only logic files directly. No host app, no
  # simulator, no SwiftData/CloudKit — runs in milliseconds.
  # INVARIANT: only add files here that import nothing beyond Foundation, or the
  # bundle won't link. Files with SwiftData/SwiftUI deps don't belong.
  SeptenaCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SeptenaCoreTests
        excludes:
          - "**/.DS_Store"
      - path: SeptenaCore/DateParser.swift
      - path: SeptenaCore/Logging.swift
      - path: SeptenaCore/ThingsImport/ThingsImportModels.swift
      - path: SeptenaCore/ThingsImport/ThingsDateDecoder.swift
      - path: SeptenaCore/ThingsImport/ThingsSQLiteReader.swift
      - path: SeptenaCore/ThingsImport/ThingsImportParser.swift
      - path: SeptenaCore/ThingsImport/ThingsImportMapping.swift
      - path: SeptenaCore/ThingsImport/ThingsImportScratchpad.swift
      - path: SeptenaCore/ThingsImport/ThingsToSeptenaMapper.swift
      - path: SeptenaCore/TaskConvo.swift
      - path: SeptenaCore/ConvoDerived.swift
      - path: SeptenaCore/TaskFade.swift
      - path: SeptenaCore/Generated/RegistryConstants.swift
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.cloud.coretests

  # Septask marketing-screenshot capture (App Store viz pipeline, appstore/,
  # SEPTENA_APP=septask). Task-only sidebar navigation; see the test file.
  SeptaskUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SeptaskUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Septask
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.tasks.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Septask

  SeptaskMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: SeptaskMacUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeptaskMac
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.tasks.macuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SeptaskMac

# Run actions build **Release**, deliberately.
#
# Debug is already `-Osize` (see the `configs` block above), but that is not the
# same thing as Release: Debug still carries assertions, no cross-module
# optimization, and — because so much behavior is `#if DEBUG`-gated — a
# materially different app. Speed work has to be measured on the build that
# ships, so ⌘R gives you that build. Consequences worth knowing:
#   • debug-only affordances are gone at runtime — the dashboard's ⟨ / ⟩ day
#     time-travel strip, the Milestones preview row, the server inspector;
#   • telemetry is LIVE in Release (`Telemetry` / `SeptaskDiagnostics` return
#     early only under `#if DEBUG`), so dev runs post to the community worker;
#   • step-debugging is effectively gone (it was already imprecise under -Osize).
# Flip a scheme's `run: config:` back to `Debug` here for a debugging session.
#
# `test:` stays on Debug ON PURPOSE and must not be flipped: the UI-test and
# App Store screenshot pipeline runs against `DemoSeedMode` (`-SeptenaSeed`),
# which is compiled out of Release.
schemes:
  Septask:
    build:
      targets:
        Septask: all
    run:
      config: Release
      debugEnabled: false
    test:
      config: Debug
      targets:
        - SeptaskUITests
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release

  SeptaskMac:
    build:
      targets:
        SeptaskMac: all
    run:
      config: Release
    test:
      config: Debug
      targets:
        - SeptaskMacUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  SeptaskWatch:
    build:
      targets:
        SeptaskWatch: all
    run:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Standalone unit-test scheme. Runs fast (no host app):
  #   xcodebuild test -scheme SeptenaCoreTests -destination 'platform=macOS'
  SeptenaCoreTests:
    build:
      targets:
        SeptenaCoreTests: all
    test:
      config: Debug
      targets:
        - SeptenaCoreTests
