name: Septena
options:
  bundleIdPrefix: com.septena
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  defaultConfig: Release

# Sparkle is linked only by the direct-distribution macOS target below.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.2
  # The shared Rust core (ADR 0025), pinned to a GitHub release by
  # scripts/core-pin.sh. Xcode downloads the prebuilt XCFramework; no build
  # compiles Rust. Not on the watch: Rust's watchOS targets are tier 3.
  SeptenaSharedCore:
    path: core/release/swift

settings:
  base:
    SWIFT_VERSION: "5.10"
    # `targeted` (not `minimal`): the compiler checks every type that has
    # actually adopted concurrency — async/await, actors, @MainActor — which is
    # exactly where a real data race can live, and the tree builds clean under
    # it. `complete` is NOT viable yet: SwiftData's `#Predicate` key paths
    # aren't Sendable on Swift 5.10, which buries the signal under ~1600
    # spurious warnings, and the type-checker crashes outright on the largest
    # view bodies. Revisit when those files are broken up and we move to Swift 6.
    SWIFT_STRICT_CONCURRENCY: targeted
    # Apple silicon only on the Mac: no Intel slice. The shared core's
    # XCFramework ships macOS arm64 only, so a universal build fails to link.
    "ARCHS[sdk=macosx*]": arm64
    # MARKETING_VERSION is the deliberate, human-chosen release version
    # (SemVer). Bump it by hand here only when cutting a release — see
    # docs/VERSIONING.md. CURRENT_PROJECT_VERSION (the build number) is NOT set
    # here on purpose: it lives in Config/Base.xcconfig so `scripts/stamp-
    # version.sh` can stamp it from the git commit count at archive time
    # (monotonic, conflict-free across parallel sessions).
    MARKETING_VERSION: "0.9.0"
    DEVELOPMENT_TEAM: $(SEPTENA_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  configs:
    # Debug defaults to `-Onone`, which makes SwiftUI/SwiftData/Observation
    # (all heavily generic) 10–50× slower on-device — the app is unusable
    # in a plain debug build even though Release is fast. Optimize Debug so
    # dev-device runs match Release speed. Trade-off: step-debugging is less
    # precise (locals may read "optimized out", breakpoints can skip inlined
    # frames). For a pure breakpoint session, temporarily set this back to
    # `-Onone` in Xcode's build settings (or revert this line).
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"

targets:
  # The iOS task app, Septena (docs/SEPTASK.md). The target keeps its working
  # name. Septask.entitlements is hand-maintained.
  # `SEPTASK` is set for every app target and no source branches on its absence:
  # the life OS left in ADR 0017. Do not add new `#if SEPTASK` switches.
  Septask:
    type: application
    platform: iOS
    sources:
      - path: Septask
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      - path: SeptenaCore
        excludes:
          - "**/.DS_Store"
      - path: Septena/Shell/Tasks
      - path: Septena/Shell/Sidebar
      - path: Septena/Shell/UI
      - path: Septena/App/ContentView.swift
      - path: Septena/App/NavigationState.swift
      - path: Septena/App/ShortcutAction.swift
      - path: Septena/Shell/Settings/SettingsKeys.swift
      # Supporter-finish constants used by LogCommit's celebration variant.
      - path: Septena/Shell/Settings/SeptenaPlus.swift
      - path: Septena/Shell/Settings/AISettingsPane.swift
      - path: Septena/Shell/Settings/SettingsChrome.swift
      - path: Septena/Shell/Settings/SettingsStore.swift
      - path: Septena/Shell/Settings/ConnectedAppsDetails.swift
      # Shared string catalog — localizes the whole reused task UI (already
      # translated) and collects Septask-only strings for translation.
      - path: Septena/Localizable.xcstrings
      - path: Septena/Shell/Capture/AddInfo/AddInfoRouter.swift
      - path: Septena/Shell/Capture/AddInfo/AddInfoRow.swift
      - path: Septena/Shell/Capture/QuickFindView.swift
      # Drawer chrome: task views use its shared plumbing (`macSheetFrame`,
      # the `usesPushNavigation` / `rowHInset` environment keys).
      - path: Septena/Shell/Sections/SectionDrawer.swift
      - path: Septena/Shell/Intelligence/OnDeviceReasoningProvider.swift
      - path: Septena/Shell/Intelligence/OnDeviceAI.swift
      - path: Septena/Shell/Intelligence/Components/FlowLayout.swift
    dependencies:
      - package: SeptenaSharedCore
      - target: SeptaskShare
        embed: true
        codeSign: true
      - target: SeptaskWidgets
        embed: true
        codeSign: true
      # The Septena watch app (docs/WATCH.md). If the installed watchOS
      # simulator runtimes don't match this Xcode's SDK, the iOS scheme can't
      # resolve a watch destination: build SeptaskMac / SeptaskWatch to verify
      # instead, or comment these three lines out locally (never commit that —
      # an archive made without them ships no watch app).
      - target: SeptaskWatch
        embed: true
        codeSign: true
      # On-device reasoning (Shell/Intelligence).
      - sdk: FoundationModels.framework
    info:
      path: Septask/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Septena
        CFBundleName: Septena
        CFBundleLocalizations:
          - en
          - fr
          - de
          - es
          - pt-BR
          - nl
        ITSAppUsesNonExemptEncryption: false
        # A blank launch screen: only the system background (white / black,
        # Septask/Assets.xcassets/LaunchBackground). No glyph, so the first
        # frame replaces an empty screen instead of a logo (docs/LAUNCH_PERF.md).
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Scene lifecycle so Home Screen Quick Actions land: the cold-launch
        # item rides UIScene.ConnectionOptions, delivered to SeptaskSceneDelegate
        # (SeptaskQuickActions.swift). Without an explicit delegate class iOS
        # uses a no-op default and drops the tap. Mirrors the full app.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SeptaskSceneDelegate
        UIApplicationSupportsIndirectInputEvents: true
        # App Store validation rejects an iPad bundle without all four
        # orientations (iPad multitasking). This target writes its own
        # Info.plist, so the project-level INFOPLIST_KEY_ values never reach it.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Always-present icon long-press actions. Types match
        # ShortcutAction's raw values.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.septena.app.newtask
            UIApplicationShortcutItemTitle: Quick Add
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeAdd
          - UIApplicationShortcutItemType: com.septena.app.today
            UIApplicationShortcutItemTitle: Today
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeDate
        # No UIBackgroundModes: Septask registers for no push (CloudKit-free,
        # and the backend's silent push is not built yet).
        # The compiled task UI includes the Reminders inbox and the Today
        # calendar strip (EventKit) — access requests crash without these.
        NSRemindersFullAccessUsageDescription: Septena moves reminders from your Reminders lists into the Inbox and deletes them from Reminders.
        NSRemindersUsageDescription: Septena moves reminders from your Reminders lists into the Inbox and deletes them from Reminders.
        NSCalendarsFullAccessUsageDescription: Septena shows today's calendar events above your task list.
        NSCalendarsUsageDescription: Septena shows today's calendar events above your task list.
        NSCameraUsageDescription: Septena uses the camera to scan sign-in codes from your other devices.
        CFBundleURLTypes:
          - CFBundleURLName: com.septena.tasks
            CFBundleURLSchemes:
              - septask
    postBuildScripts:
      # Build number = git commit count, on every build (scripts/stamp-built-plist.sh).
      - name: Stamp build number
        script: "\"${SRCROOT}/scripts/stamp-built-plist.sh\""
        # The input orders this phase after Info.plist processing. Without it
        # the app target can rewrite Info.plist after the stamp (seen 2026-11-23).
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        basedOnDependencyAnalysis: false
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_NAME: Septena
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.tasks
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        # No global accent: controls, toggles, selection and menus use the
        # platform accent (the user's System Settings accent on macOS).
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Septask/Septask.entitlements
      configs:
        # DEBUG must be restated: overriding SWIFT_ACTIVE_COMPILATION_CONDITIONS
        # replaces Xcode's Debug default rather than appending to it, and
        # DemoSeedMode gates on `#if DEBUG`.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG SEPTASK"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "SEPTASK"

  SeptaskShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension/ShareViewController.swift
      - path: ShareExtension/PrivacyInfo.xcprivacy
      - path: SeptenaCore/SharedTaskCapture.swift
    info:
      path: ShareExtension/SeptaskShare-Info.plist
      properties:
        CFBundleDisplayName: Septena
        CFBundleName: Septena
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    postBuildScripts:
      # Build number = git commit count, on every build (scripts/stamp-built-plist.sh).
      - name: Stamp build number
        script: "\"${SRCROOT}/scripts/stamp-built-plist.sh\""
        # The input orders this phase after Info.plist processing. Without it
        # the app target can rewrite Info.plist after the stamp (seen 2026-11-23).
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        basedOnDependencyAnalysis: false
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.tasks.share
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ShareExtension/SeptaskShare.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "SHARE_EXTENSION"

  # Home Screen & Lock Screen widgets for Septask iOS (docs/TASK_WIDGETS_SPEC.md, #161).
  # Shares sources in lockstep with SeptaskMacWidgets; compiles only pure-Foundation
  # widget wire/store/intents so extension memory stays well below WidgetKit's cap.
  SeptaskWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SeptaskWidgets
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
          - "**/*.plist"
      - path: SeptenaCore/SeptenaAppGroup.swift
      - path: SeptenaCore/TasksWidgetWire.swift
      - path: SeptenaCore/TasksWidgetSnapshotStore.swift
      - path: SeptenaCore/TasksWidgetIntents.swift
    info:
      path: SeptaskWidgets/Info-iOS.plist
      properties:
        CFBundleDisplayName: Septena
        CFBundleName: Septena
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    postBuildScripts:
      # Build number = git commit count, on every build (scripts/stamp-built-plist.sh).
      - name: Stamp build number
        script: "\"${SRCROOT}/scripts/stamp-built-plist.sh\""
        # The input orders this phase after Info.plist processing. Without it
        # the app target can rewrite Info.plist after the stamp (seen 2026-11-23).
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        basedOnDependencyAnalysis: false
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.tasks.widgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SeptaskWidgets/SeptaskWidgets.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG WIDGET_EXTENSION SEPTASK"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "WIDGET_EXTENSION SEPTASK"

  # Desktop & Notification Center widgets for SeptaskMac (docs/TASK_WIDGETS_SPEC.md, #161).
  # Kept in lockstep with SeptaskWidgets.
  SeptaskMacWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: SeptaskWidgets
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
          - "**/*.plist"
      - path: SeptenaCore/SeptenaAppGroup.swift
      - path: SeptenaCore/TasksWidgetWire.swift
      - path: SeptenaCore/TasksWidgetSnapshotStore.swift
      - path: SeptenaCore/TasksWidgetIntents.swift
    info:
      path: SeptaskWidgets/Info-Mac.plist
      properties:
        CFBundleDisplayName: Septena
        CFBundleName: Septena
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    postBuildScripts:
      # Build number = git commit count, on every build (scripts/stamp-built-plist.sh).
      - name: Stamp build number
        script: "\"${SRCROOT}/scripts/stamp-built-plist.sh\""
        # The input orders this phase after Info.plist processing. Without it
        # the app target can rewrite Info.plist after the stamp (seen 2026-11-23).
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        basedOnDependencyAnalysis: false
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.tasks.widgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SeptaskWidgets/SeptaskMacWidgets.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG WIDGET_EXTENSION SEPTASK"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "WIDGET_EXTENSION SEPTASK"

  # Native macOS sibling, following the Septena / SeptenaMac pattern (separate
  # target, not a multiplatform destination). Same source list as Septask —
  # keep the two in lockstep when adding P-phase inclusions.
  SeptaskMac:
    type: application
    platform: macOS
    sources:
      - path: Septask
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      - path: SeptenaCore
        excludes:
          - "**/.DS_Store"
      - path: Septena/Shell/Tasks
      - path: Septena/Shell/Sidebar
      - path: Septena/Shell/UI
      - path: Septena/App/ContentView.swift
      - path: Septena/App/NavigationState.swift
      - path: Septena/App/ShortcutAction.swift
      - path: Septena/Shell/Settings/SettingsKeys.swift
      - path: Septena/Shell/Settings/SeptenaPlus.swift
      - path: Septena/Shell/Settings/AISettingsPane.swift
      - path: Septena/Shell/Settings/SettingsChrome.swift
      - path: Septena/Shell/Settings/SettingsStore.swift
      - path: Septena/Shell/Settings/ConnectedAppsDetails.swift
      # Shared string catalog — localizes the whole reused task UI (already
      # translated) and collects Septask-only strings for translation.
      - path: Septena/Localizable.xcstrings
      - path: Septena/Shell/Capture/AddInfo/AddInfoRouter.swift
      - path: Septena/Shell/Capture/AddInfo/AddInfoRow.swift
      - path: Septena/Shell/Capture/QuickFindView.swift
      - path: Septena/Shell/Sections/SectionDrawer.swift
      - path: Septena/Shell/Intelligence/OnDeviceReasoningProvider.swift
      - path: Septena/Shell/Intelligence/OnDeviceAI.swift
      - path: Septena/Shell/Intelligence/Components/FlowLayout.swift
      # A pre-built icns, so the corner rounding matches the Mac alpha mask.
      - path: Septask/AppIcon.icns
        type: file
    dependencies:
      - target: SeptaskMacWidgets
        embed: true
        codeSign: true
      - sdk: FoundationModels.framework
      - package: Sparkle
      - package: SeptenaSharedCore
    info:
      path: Septask/Info-Mac.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Septena
        CFBundleName: Septena
        CFBundleLocalizations:
          - en
          - fr
          - de
          - es
          - pt-BR
          - nl
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconFile: AppIcon
        SUFeedURL: https://septena.app/mac/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        NSRemindersFullAccessUsageDescription: Septena moves reminders from your Reminders lists into the Inbox and deletes them from Reminders.
        NSRemindersUsageDescription: Septena moves reminders from your Reminders lists into the Inbox and deletes them from Reminders.
        NSCalendarsFullAccessUsageDescription: Septena shows today's calendar events above your task list.
        NSCalendarsUsageDescription: Septena shows today's calendar events above your task list.
        NSCameraUsageDescription: Septena uses the camera to scan sign-in codes from your other devices.
        CFBundleURLTypes:
          - CFBundleURLName: com.septena.tasks
            CFBundleURLSchemes:
              - septask
    postBuildScripts:
      # Build number = git commit count, on every build (scripts/stamp-built-plist.sh).
      - name: Stamp build number
        script: "\"${SRCROOT}/scripts/stamp-built-plist.sh\""
        # The input orders this phase after Info.plist processing. Without it
        # the app target can rewrite Info.plist after the stamp (seen 2026-11-23).
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        basedOnDependencyAnalysis: false
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        # Target name stays `SeptaskMac` internally; the shipped app bundle
        # is `Septena.app` (ADR 0007).
        PRODUCT_NAME: Septena
        # Same bundle ID as iOS: one App Store record per product, one purchase
        # on both platforms (ADR 0007). Was com.septena.tasks.mac until 2026-11-19.
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.tasks
        # No global accent: controls, toggles, selection and menus use the
        # platform accent (the user's System Settings accent on macOS).
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Septask/SeptaskMac.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG SEPTASK"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "SEPTASK"

  SeptaskWatch:
    type: application
    platform: watchOS
    sources:
      - path: SeptaskWatch
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      # The watch wire (docs/WATCH.md). Foundation only: the watch is a thin
      # client of the backend's /v1/tasks views and compiles no task model.
      - path: SeptenaCore/TasksWatchWire.swift
    dependencies:
      - target: SeptaskWatchComplication
        embed: true
        codeSign: true
    info:
      path: SeptaskWatch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Septena
        CFBundleName: Septena
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.septena.tasks
    postBuildScripts:
      # Build number = git commit count, on every build (scripts/stamp-built-plist.sh).
      - name: Stamp build number
        script: "\"${SRCROOT}/scripts/stamp-built-plist.sh\""
        # The input orders this phase after Info.plist processing. Without it
        # the app target can rewrite Info.plist after the stamp (seen 2026-11-23).
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        basedOnDependencyAnalysis: false
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_NAME: Septena
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.tasks.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SeptaskWatch/SeptaskWatch.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG SEPTASK"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "SEPTASK"

  SeptaskWatchComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: SeptaskWatchComplication
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      - path: SeptaskWatch/TasksTodayComplicationData.swift
    info:
      path: SeptaskWatchComplication/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Septena
        CFBundleName: Septena
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    postBuildScripts:
      # Build number = git commit count, on every build (scripts/stamp-built-plist.sh).
      - name: Stamp build number
        script: "\"${SRCROOT}/scripts/stamp-built-plist.sh\""
        # The input orders this phase after Info.plist processing. Without it
        # the app target can rewrite Info.plist after the stamp (seen 2026-11-23).
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        basedOnDependencyAnalysis: false
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.tasks.watchkitapp.today
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SeptaskWatchComplication/SeptaskWatchComplication.entitlements

  # Hermetic unit tests for pure SeptenaCore logic. SeptenaCore is NOT a
  # framework — it's source compiled into each app target — so there's nothing
  # to @testable import. Instead this standalone macOS test bundle recompiles
  # the self-contained, Foundation-only logic files directly. No host app, no
  # simulator, no SwiftData/CloudKit — runs in milliseconds.
  # INVARIANT: only add files here that import nothing beyond Foundation, or the
  # bundle won't link. Files with SwiftData/SwiftUI deps don't belong.
  SeptenaCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SeptenaCoreTests
        excludes:
          - "**/.DS_Store"
      - path: SeptenaCore/DateParser.swift
      - path: SeptenaCore/Logging.swift
      - path: SeptenaCore/ThingsImport/ThingsImportModels.swift
      - path: SeptenaCore/ThingsImport/ThingsDateDecoder.swift
      - path: SeptenaCore/ThingsImport/ThingsSQLiteReader.swift
      - path: SeptenaCore/ThingsImport/ThingsImportParser.swift
      - path: SeptenaCore/ThingsImport/ThingsImportScratchpad.swift
      - path: SeptenaCore/TaskConvo.swift
      - path: SeptenaCore/ConvoDerived.swift
      - path: SeptenaCore/TaskFade.swift
      - path: SeptenaCore/InboxZeroMotion.swift
      - path: SeptenaCore/SharedCoreBridge.swift
      - path: SeptenaCore/TasksWidgetWire.swift
      - path: SeptenaCore/TaskBackend/TaskBackendLimits.swift
      - path: SeptenaCore/TaskBackend/TaskBackendWire.swift
      - path: SeptenaCore/TaskBackend/TaskSyncSettings.swift
      - path: SeptenaCore/TaskBackend/PlusAccountOwnership.swift
      - path: SeptenaCore/AppSettings.swift
      - path: SeptenaCore/Generated/RegistryConstants.swift
    dependencies:
      - package: SeptenaSharedCore
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.cloud.coretests

  # Septask marketing-screenshot capture (App Store viz pipeline, appstore/,
  # SEPTENA_APP=septask). Task-only sidebar navigation; see the test file.
  SeptaskUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SeptaskUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Septask
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.tasks.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Septask

  SeptaskMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: SeptaskMacUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeptaskMac
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.tasks.macuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SeptaskMac

# Run actions build **Release**, deliberately.
#
# Debug is already `-Osize` (see the `configs` block above), but that is not the
# same thing as Release: Debug still carries assertions, no cross-module
# optimization, and — because so much behavior is `#if DEBUG`-gated — a
# materially different app. Speed work has to be measured on the build that
# ships, so ⌘R gives you that build. Consequences worth knowing:
#   • debug-only affordances are gone at runtime — the dashboard's ⟨ / ⟩ day
#     time-travel strip, the Milestones preview row, the server inspector;
#   • step-debugging is effectively gone (it was already imprecise under -Osize).
# Flip a scheme's `run: config:` back to `Debug` here for a debugging session.
#
# `test:` stays on Debug ON PURPOSE and must not be flipped: the UI-test and
# App Store screenshot pipeline runs against `DemoSeedMode` (`-SeptenaSeed`),
# which is compiled out of Release.
schemes:
  Septask:
    build:
      targets:
        Septask: all
    run:
      config: Release
      debugEnabled: false
      # Local StoreKit testing for the Plus sheet before the App Store
      # Connect products exist (docs/SYNC_SUBSCRIPTION_SPEC.md §7.1). The
      # variable only reaches a run Xcode launches; TestFlight and the App
      # Store never see it.
      storeKitConfiguration: Config/Septena.storekit
      environmentVariables:
        SEPTENA_STOREKIT_TEST: "1"
    test:
      config: Debug
      targets:
        - SeptaskUITests
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release

  SeptaskMac:
    build:
      targets:
        SeptaskMac: all
    run:
      config: Release
      # Same local StoreKit testing as the Septask scheme (ADR 0026: the
      # Mac sells through the Mac App Store).
      storeKitConfiguration: Config/Septena.storekit
      environmentVariables:
        SEPTENA_STOREKIT_TEST: "1"
    test:
      config: Debug
      targets:
        - SeptaskMacUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  SeptaskWatch:
    build:
      targets:
        SeptaskWatch: all
    run:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Standalone unit-test scheme. Runs fast (no host app):
  #   xcodebuild test -scheme SeptenaCoreTests -destination 'platform=macOS'
  SeptenaCoreTests:
    build:
      targets:
        SeptenaCoreTests: all
    test:
      config: Debug
      targets:
        - SeptenaCoreTests
