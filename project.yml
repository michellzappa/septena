name: Septena
options:
  bundleIdPrefix: com.septena
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 992N457T8D
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  configs:
    # Debug defaults to `-Onone`, which makes SwiftUI/SwiftData/Observation
    # (all heavily generic) 10–50× slower on-device — the app is unusable
    # in a plain debug build even though Release is fast. Optimize Debug so
    # dev-device runs match Release speed. Trade-off: step-debugging is less
    # precise (locals may read "optimized out", breakpoints can skip inlined
    # frames). For a pure breakpoint session, temporarily set this back to
    # `-Onone` in Xcode's build settings (or revert this line).
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"

targets:
  Septena:
    type: application
    platform: iOS
    sources:
      - path: Septena
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      - path: SeptenaCore
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SeptenaWatch
        embed: true
        codeSign: true
      - sdk: FoundationModels.framework
      - target: SeptenaLiveActivitiesExtension
        embed: true
        codeSign: true
      - target: SeptenaWidgets
        embed: true
        codeSign: true
    info:
      path: Septena/Info.plist
      properties:
        CFBundleDisplayName: Septena
        CFBundleLocalizations:
          - en
          - fr
          - de
          - es
          - pt-BR
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - remote-notification
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.septena.cloud
            CFBundleURLSchemes:
              - septena
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSRemindersFullAccessUsageDescription: Septena imports tasks from your Reminders lists into the Inbox.
        NSRemindersUsageDescription: Septena imports tasks from your Reminders lists into the Inbox.
        NSCalendarsFullAccessUsageDescription: Septena shows upcoming events from your calendars on the Week dashboard.
        NSCalendarsUsageDescription: Septena shows upcoming events from your calendars on the Week dashboard.
        NSHealthShareUsageDescription: Septena reads your activity and recovery metrics (steps, exercise, VO2, HRV, resting heart rate) so the Activity tile can show them on the Week dashboard. Data stays on your device.
        NSHealthUpdateUsageDescription: Septena saves your mood check-ins and nutrition entries (meals, macros, water) to HealthKit so they appear in the Health app alongside your other data. Data stays on your device.
        NSPhotoLibraryUsageDescription: Septena attaches photos to your meal entries and shows their thumbnails in your nutrition log. Photos stay on your device.
        WithingsClientID: $(WITHINGS_CLIENT_ID)
        WithingsClientSecret: $(WITHINGS_CLIENT_SECRET)
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.cloud
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconRed AppIconOrange AppIconYellow AppIconGreen AppIconCyan AppIconBlue AppIconPurple"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Septena/Septena.entitlements

  SeptenaMac:
    type: application
    platform: macOS
    sources:
      - path: Septena
        excludes:
          - "**/.DS_Store"
          - Widgets
          - "**/*.entitlements"
      - path: SeptenaCore
        excludes:
          - "**/.DS_Store"
      # Standalone icns generated with iconutil — Xcode's asset-catalog
      # compiler on this SDK silently drops Mac icon slots above 128px when
      # they share content with other slots. Bundling a pre-built icns
      # sidesteps that entirely.
      - path: Septena/AppIcon.icns
        type: file
    info:
      path: Septena/Info-Mac.plist
      properties:
        CFBundleDisplayName: Septena
        CFBundleLocalizations:
          - en
          - fr
          - de
          - es
          - pt-BR
        CFBundleIconFile: AppIcon
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSRemindersFullAccessUsageDescription: Septena imports tasks from your Reminders lists into the Inbox.
        NSRemindersUsageDescription: Septena imports tasks from your Reminders lists into the Inbox.
        NSCalendarsFullAccessUsageDescription: Septena shows upcoming events from your calendars on the Week dashboard.
        NSCalendarsUsageDescription: Septena shows upcoming events from your calendars on the Week dashboard.
        NSHealthShareUsageDescription: Septena reads your activity and recovery metrics (steps, exercise, VO2, HRV, resting heart rate) so the Activity tile can show them on the Week dashboard. Data stays on your device.
        NSHealthUpdateUsageDescription: Septena saves your mood check-ins and nutrition entries (meals, macros, water) to HealthKit so they appear in the Health app alongside your other data. Data stays on your device.
        NSPhotoLibraryUsageDescription: Septena attaches photos to your meal entries and shows their thumbnails in your nutrition log. Photos stay on your device.
        WithingsClientID: $(WITHINGS_CLIENT_ID)
        WithingsClientSecret: $(WITHINGS_CLIENT_SECRET)
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.cloud.mac
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Septena/SeptenaMac.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: FoundationModels.framework

  SeptenaWatch:
    type: application
    platform: watchOS
    sources:
      - path: SeptenaWatch
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      # Shared "Next" wire/membership types compiled straight into the watch
      # target (no shared framework), so the phone and watch can never disagree
      # about Next's shape. These are single-sourced in SeptenaCore — see the
      # header in NextWire.swift / NextBlocks.swift. NextWire needs DayBucket.
      - path: SeptenaCore/NextWire.swift
      - path: SeptenaCore/DayBucket.swift
      - path: SeptenaCore/NextBlocks.swift
      # Quick-log dispatch table for actionable suggestions (caffeine/cannabis/
      # mood) — single-sourced like NextBlocks so the wrist write can't drift.
      - path: SeptenaCore/SuggestionBlocks.swift
      # Generic container math for intake trackers — the wrist + menu renders
      # each wire kind's choices with the same logic as the phone.
      - path: SeptenaCore/ConsumableContainer.swift
      # Canonical mood word grid, shared with the phone's MoodCatalog so the
      # watch's 3×3 emotion picker can't diverge.
      - path: SeptenaCore/MoodVocabulary.swift
    dependencies:
      - target: SeptenaWatchComplication
        embed: true
        codeSign: true
    info:
      path: SeptenaWatch/Info.plist
      properties:
        CFBundleDisplayName: Septena
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.septena.cloud
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.cloud.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SeptenaWatch/SeptenaWatch.entitlements

  SeptenaWatchComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: SeptenaWatchComplication
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      - path: SeptenaWatch/SharedComplicationData.swift
    info:
      path: SeptenaWatchComplication/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.cloud.watchkitapp.next
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SeptenaWatchComplication/SeptenaWatchComplication.entitlements

  SeptenaLiveActivitiesExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SeptenaLiveActivitiesExtension
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      - path: SeptenaCore/TrainingLiveActivity.swift
    info:
      path: SeptenaLiveActivitiesExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.cloud.liveactivities
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SeptenaLiveActivitiesExtension/SeptenaLiveActivitiesExtension.entitlements

  SeptenaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SeptenaWidgets
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
      # Shared "Next" wire types compiled straight into the widget (same pattern
      # as the watch target). The widget renders NextItem snapshots, so it needs
      # NextWire + DayBucket. NextWire needs DayBucket.
      - path: SeptenaCore/NextWire.swift
      - path: SeptenaCore/DayBucket.swift
    info:
      path: SeptenaWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.cloud.widgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SeptenaWidgets/SeptenaWidgets.entitlements

  # Hermetic unit tests for pure SeptenaCore logic. SeptenaCore is NOT a
  # framework — it's source compiled into each app target — so there's nothing
  # to @testable import. Instead this standalone macOS test bundle recompiles
  # the self-contained, Foundation-only logic files directly. No host app, no
  # simulator, no SwiftData/CloudKit — runs in milliseconds.
  # INVARIANT: only add files here that import nothing beyond Foundation, or the
  # bundle won't link. Files with SwiftData/SwiftUI deps don't belong.
  SeptenaCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SeptenaCoreTests
        excludes:
          - "**/.DS_Store"
      - path: SeptenaCore/Fasting.swift
      - path: SeptenaCore/DateParser.swift
      - path: SeptenaCore/ConsumableContainer.swift
      - path: SeptenaCore/SuggestionBlocks.swift
      - path: SeptenaCore/IntakeModel.swift
      - path: SeptenaCore/GutSymptomMigrationMap.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.cloud.coretests

  SeptenaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SeptenaUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Septena
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.septena.cloud.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Septena

schemes:
  Septena:
    build:
      targets:
        Septena: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SeptenaUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  SeptenaWatch:
    build:
      targets:
        SeptenaWatch: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  SeptenaMac:
    build:
      targets:
        SeptenaMac: all
    run:
      config: Debug

  # Standalone unit-test scheme. Runs fast (no host app):
  #   xcodebuild test -scheme SeptenaCoreTests -destination 'platform=macOS'
  SeptenaCoreTests:
    build:
      targets:
        SeptenaCoreTests: all
    test:
      config: Debug
      targets:
        - SeptenaCoreTests
