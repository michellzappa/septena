name: Android CI

on:
  push:
    branches: [main, "wt/**"]
    paths:
      - "android/**"
      - "registry/**"
      - "scripts/gen-registries.mjs"
      - "core/release/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "registry/**"
      - "scripts/gen-registries.mjs"
      - "core/release/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  # A run on main is never cancelled (F4, #345): it finishes, and only the
  # newest waiting commit runs after it. A branch or PR run gives way to its
  # next push.
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # One fixed signing key for every APK (scripts/android-tester-keystore.sh),
      # so an installed APK updates. The runner's debug key changes on every run.
      # A push to main without the key fails; a pull request builds unsigned.
      - name: Tester signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_TESTER_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tester.p12"
            echo "SIGN=-PseptenaTesterStoreFile=$RUNNER_TEMP/tester.p12" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::Secret ANDROID_TESTER_KEYSTORE_B64 is missing. mz runs scripts/android-tester-keystore.sh once."
            exit 1
          else
            echo "::warning::No tester key: this APK has the runner's debug key and cannot update an installed app."
          fi

      - name: Assemble debug and release APKs
        env:
          ORG_GRADLE_PROJECT_septenaTesterStorePassword: ${{ secrets.ANDROID_TESTER_KEYSTORE_PASSWORD }}
        run: |
          BUILD_NUM="$(git rev-list --count HEAD)"
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease -PseptenaBuildNumber="$BUILD_NUM" ${SIGN:-}

      - name: Clean up tester signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/tester.p12"

      # The shared conformance vectors on the JVM, through the core's Linux
      # natives (F3, #344). :core:test runs them.
      - name: Core conformance vectors
        run: ./gradlew --no-daemon :core:test

      # The SQLDelight store's pull merge and outbox against sync-engine.json.
      - name: Store conformance vectors
        run: ./gradlew --no-daemon :store:test

      # JVM unit tests of the app, the theme launch guard among them (#344).
      - name: App unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: septena-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 2

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: septena-android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 2
