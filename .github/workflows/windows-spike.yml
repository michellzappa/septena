name: Windows spike

on:
  push:
    branches: [main, "wt/windows-*"]
    paths:
      - "windows/**"
      - "android/core/**"
      - "android/store/**"
      - "android/transport/**"
      - "android/ui/**"
      - "android/gradle/**"
      - "android/gradlew*"
      - "core/release/release.json"
      - "registry/**"
      - "scripts/gen-registries.mjs"
      - "scripts/registry-readers.mjs"
      - "docs/WINDOWS_IMPLEMENTATION_PLAN.md"
      - ".github/workflows/windows-spike.yml"
  pull_request:
    paths:
      - "windows/**"
      - "android/core/**"
      - "android/store/**"
      - "android/transport/**"
      - "android/ui/**"
      - "android/gradle/**"
      - "android/gradlew*"
      - "core/release/release.json"
      - "registry/**"
      - "scripts/gen-registries.mjs"
      - "scripts/registry-readers.mjs"
      - ".github/workflows/windows-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 spike
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64
      - uses: gradle/actions/setup-gradle@v4

      - name: Run the core, store and offline sync checks
        run: android\gradlew.bat -p windows --no-daemon :core:test :store:test :transport:test :test smokeTest

      - name: Build the self-contained desktop image
        run: android\gradlew.bat -p windows --no-daemon createDistributable

      - name: Record the source and bundle the image
        run: |
          $image = "windows/build/compose/binaries/main/app/SeptenaSpike"
          if (!(Test-Path "$image/SeptenaSpike.exe")) { throw "Desktop launcher missing" }
          if (!(Test-Path "$image/runtime/bin/java.dll")) { throw "Bundled Java runtime missing" }
          $coreJar = Get-ChildItem "$image/app" -Filter "*septena-core-jvm-natives*.jar" -File
          if (@($coreJar).Count -ne 1) { throw "Expected one bundled shared core natives JAR" }
          $entries = jar tf $coreJar.FullName
          if ($LASTEXITCODE -ne 0 -or $entries -notcontains "win32-x86-64/septena_core.dll") {
            throw "Windows x64 shared core DLL missing from the app image"
          }
          git rev-parse HEAD | Set-Content -Encoding ascii "$image/source-commit.txt"
          "Fixture-only Windows x64 build. Extract the whole artifact, then open SeptenaSpike.exe." |
            Set-Content -Encoding ascii "$image/README.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: septena-windows-spike-x64
          path: windows/build/compose/binaries/main/app/SeptenaSpike
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  linux-x64:
    name: Linux x64 shared desktop check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64
      - uses: gradle/actions/setup-gradle@v4

      - name: Run the core, store and offline sync checks on Linux
        run: ./android/gradlew -p windows --no-daemon :core:test :store:test :transport:test :test smokeTest

      - name: Build the self-contained Linux desktop image
        run: ./android/gradlew -p windows --no-daemon createDistributable

      - name: Verify the Linux launcher and bundled shared core native library
        run: |
          image="windows/build/compose/binaries/main/app/SeptenaSpike"
          test -x "$image/bin/SeptenaSpike" || { echo "Linux desktop launcher missing"; exit 1; }
          test -d "$image/lib/runtime" || { echo "Bundled Java runtime missing"; exit 1; }
          core_jar="$(find "$image/lib/app" -maxdepth 1 -name '*septena-core-jvm-natives*.jar' -type f)"
          test "$(printf '%s\n' "$core_jar" | grep -c .)" -eq 1 || { echo "Expected one bundled shared core natives JAR"; exit 1; }
          jar tf "$core_jar" | grep -qx 'linux-x86-64/libseptena_core.so' || { echo "Linux x64 shared core .so missing from app image"; exit 1; }
