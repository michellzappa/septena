name: Septena iOS TestFlight

# Archives the Septask iOS scheme (ships as "Septena", com.septena.tasks) and
# uploads it to App Store Connect. TestFlight picks the build up after Apple
# finishes processing it.
#
# Signing: automatic signing, driven by an App Store Connect API key
# (-allowProvisioningUpdates), so Xcode creates and refreshes the provisioning
# profiles itself. No profiles live in secrets. The key needs the Admin role
# (or App Manager with access to Certificates, Identifiers & Profiles).
# The archive step signs with an Apple Development identity and the export
# re-signs with Apple Distribution, so IOS_SIGNING_P12 holds BOTH identities.
# The export names the local Apple Distribution identity (signingCertificate):
# without it Xcode tries cloud signing, which the API key is refused
# ("Cloud signing permission error", 2026-11-23).
#
# Build number = git commit count (scripts/stamp-version.sh), so every push to
# main gets a new, higher build number. MARKETING_VERSION stays the
# hand-chosen value in project.yml.
#
# Watch: project.yml has the SeptaskWatch embed commented out
# (WATCH_EMBED_DISABLED), so these builds ship WITHOUT the watch app.
#
# Secrets:
#   APPLE_API_KEY         App Store Connect .p8 contents
#   APPLE_API_KEY_ID      key id
#   APPLE_API_ISSUER_ID   issuer id
#   IOS_SIGNING_P12       base64 .p12 with the Apple Development + Apple
#                         Distribution identities of team 992N457T8D
#   IOS_SIGNING_P12_PASSWORD
# Until the secrets exist, the job skips with a notice instead of failing.
#
# Distribution: after the upload, the `distribute` job (Linux, so the wait for
# Apple's processing does not use macOS minutes) adds the build to the
# external group "Public beta", which owns the public link, and sends it to
# beta review (scripts/testflight-distribute.mjs). Apple holds one build in
# review at a time; a refused submission is a notice, not a failure.
#
# Device builds (docs/DEVICE_BUILDS.md): a push to device/<name>, or a manual
# run with `branch`, builds that branch for the internal group "Device builds"
# only. It never reaches "Public beta" and is never sent to beta review. It
# ships in its own version train (<major>.999.<n>), so its numbers never
# collide with a build from main. The environment apple-device needs mz's
# approval before the job gets the signing secrets, because the job runs the
# branch's own build scripts.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "backend/**"
      - "tools/**"
      - "appstore/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch for a device build. Empty: the normal Public beta build of main."
        type: string
        default: ""
  workflow_run:
    workflows: ["Device build request"]
    branches: ["device/**"]
    types: [completed]

# Several sessions push to main within minutes of each other. Cancelling the
# running upload on each push meant no run ever finished. A running upload now
# finishes; GitHub keeps only the newest pending run behind it.
# A device build gives way to the next push of the same branch.
concurrency:
  group: ${{ (github.event_name == 'workflow_run' && format('testflight-device-{0}', github.event.workflow_run.head_branch)) || (inputs.branch && format('testflight-device-{0}', inputs.branch)) || 'testflight-ios' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' || (inputs.branch || '') != '' }}

permissions:
  contents: read

env:
  TEAM_ID: 992N457T8D
  DEVICE_BUILD: ${{ github.event_name == 'workflow_run' || (inputs.branch || '') != '' }}

jobs:
  upload:
    name: Archive and upload (iOS)
    # A fork can start a workflow_run too. Only a successful push to a device
    # branch of this repository counts.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: macos-26
    environment: ${{ (github.event_name == 'workflow_run' || (inputs.branch || '') != '') && 'apple-device' || 'apple-release' }}
    outputs:
      marketing_version: ${{ steps.stamp.outputs.marketing_version }}
      ready: ${{ steps.gate.outputs.ready }}
      build_number: ${{ steps.stamp.outputs.build_number }}
    steps:
      - name: Check signing secrets
        id: gate
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          IOS_SIGNING_P12: ${{ secrets.IOS_SIGNING_P12 }}
        run: |
          if [[ -n "$APPLE_API_KEY" && -n "$IOS_SIGNING_P12" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TestFlight secrets are not set; skipping upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) || inputs.branch || github.sha }}
          fetch-depth: 0  # stamp-version.sh needs the full commit count
          persist-credentials: false

      - name: Select Xcode
        if: steps.gate.outputs.ready == 'true'
        run: |
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        if: steps.gate.outputs.ready == 'true'
        run: brew install xcodegen

      - name: Stamp build number and generate project
        id: stamp
        if: steps.gate.outputs.ready == 'true'
        run: |
          scripts/stamp-version.sh
          echo "build_number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          VERSION=$(sed -nE 's/^ +MARKETING_VERSION: "([0-9.]+)"$/\1/p' project.yml)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "no single MARKETING_VERSION in project.yml" >&2; exit 1; }
          if [[ "$DEVICE_BUILD" == "true" ]]; then
            VERSION="${VERSION%%.*}.999.$(( GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))"
          fi
          echo "marketing_version=$VERSION" >> "$GITHUB_OUTPUT"
          xcodegen generate

      - name: Import signing identities and API key
        if: steps.gate.outputs.ready == 'true'
        env:
          IOS_SIGNING_P12: ${{ secrets.IOS_SIGNING_P12 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/septena-ios.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT="$RUNNER_TEMP/septena-ios.p12"
          printf '%s' "$IOS_SIGNING_P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$IOS_SIGNING_P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          rm -f "$CERT"
          IDS=$(security find-identity -v -p codesigning "$KEYCHAIN")
          echo "$IDS" | grep -q '"Apple Development' || { echo "IOS_SIGNING_P12 has no Apple Development identity" >&2; exit 1; }
          echo "$IDS" | grep -q '"Apple Distribution' || { echo "IOS_SIGNING_P12 has no Apple Distribution identity" >&2; exit 1; }

          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "$APPLE_API_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive
        if: steps.gate.outputs.ready == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          MARKETING: ${{ steps.stamp.outputs.marketing_version }}
        run: |
          xcodebuild archive \
            -scheme Septask \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Septask.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" \
            SEPTENA_DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="$MARKETING"

      - name: Export and upload to App Store Connect
        if: steps.gate.outputs.ready == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$OPTIONS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Septask.xcarchive" \
            -exportOptionsPlist "$OPTIONS" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"

      - name: Clean up keychain and key
        if: always() && steps.gate.outputs.ready == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/septena-ios.keychain-db" || true
          rm -f "$ASC_KEY_PATH"

  distribute:
    name: Distribute
    needs: upload
    if: needs.upload.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # This job runs main's own script, never the branch's, so a device build
    # needs no second approval here.
    environment: apple-release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/testflight-distribute.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Distribute build ${{ needs.upload.outputs.build_number }}
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          ASC_APP_ID: "6836809027"
          BUILD_NUMBER: ${{ needs.upload.outputs.build_number }}
          MARKETING_VERSION: ${{ needs.upload.outputs.marketing_version }}
          TESTFLIGHT_GROUP: ${{ env.DEVICE_BUILD == 'true' && 'Device builds' || 'Public beta' }}
          DEVICE_NOTE: ${{ env.DEVICE_BUILD == 'true' && (github.event.workflow_run.head_branch || inputs.branch) || '' }}
        run: node scripts/testflight-distribute.mjs
