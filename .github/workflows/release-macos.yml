name: Septask macOS Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a GitHub Release and deploy the update site"
        type: boolean
        default: false
      notarize:
        description: "Sign with Developer ID and notarize"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'push' || inputs.publish
    runs-on: macos-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"\([^"]*\)".*/\1/p' project.yml | head -1)
          BUILD=$(git rev-list --count HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "tag $GITHUB_REF_NAME does not match project.yml MARKETING_VERSION $VERSION" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          [[ -n "$MACOS_CERTIFICATE_P12" && -n "$MACOS_CERTIFICATE_PASSWORD" ]] || {
            echo "Developer ID certificate secrets are required for a release" >&2
            exit 1
          }
          CERT="$RUNNER_TEMP/septask-developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/septask.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT"
          security create-keychain -p "${KEYCHAIN_PASSWORD:-septask-ci}" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD:-septask-ci}" "$KEYCHAIN"
          security import "$CERT" -P "$MACOS_CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "${KEYCHAIN_PASSWORD:-septask-ci}" "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [[ -n "$IDENTITY" ]] || { security find-identity -v -p codesigning "$KEYCHAIN"; exit 1; }
          echo "SEPTASK_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Install CloudKit provisioning profile
        env:
          SEPTASK_PROVISION_PROFILE_BASE64: ${{ secrets.SEPTASK_PROVISION_PROFILE_BASE64 }}
        run: |
          if [[ -n "$SEPTASK_PROVISION_PROFILE_BASE64" ]]; then
            printf '%s' "$SEPTASK_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/septask.provisionprofile"
            echo "SEPTASK_PROVISION_PROFILE=$RUNNER_TEMP/septask.provisionprofile" >> "$GITHUB_ENV"
          else
            echo "warning: no CloudKit provisioning profile secret; the app will still be signed" >&2
          fi

      - name: Build, sign, notarize, and package
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SEPTASK_TEAM_ID: ${{ secrets.SEPTASK_TEAM_ID }}
        run: |
          [[ -n "$SPARKLE_PUBLIC_ED_KEY" ]] || { echo "SPARKLE_PUBLIC_ED_KEY is required" >&2; exit 1; }
          if [[ "${{ github.event_name == 'push' || inputs.notarize }}" == "true" ]]; then
            ./scripts/build-macos-release.sh --release --notarize
          else
            ./scripts/build-macos-release.sh --release
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/Septask-macOS.zip
            dist/version.txt

      - name: Locate Sparkle appcast tool
        id: sparkle
        run: |
          TOOL=$(find .build-macos-release "$HOME/Library/Developer/Xcode/DerivedData" \
            -type f -path '*/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast' \
            -perm -111 -print | head -1)
          [[ -x "$TOOL" ]] || { echo "generate_appcast not found" >&2; exit 1; }
          echo "tool=$TOOL" >> "$GITHUB_OUTPUT"

      - name: Generate signed update site
        env:
          SPARKLE_GENERATE_APPCAST: ${{ steps.sparkle.outputs.tool }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          [[ -n "$SPARKLE_PRIVATE_ED_KEY" ]] || { echo "SPARKLE_PRIVATE_ED_KEY is required" >&2; exit 1; }
          ./scripts/generate-update-site.sh \
            dist/Septask-macOS.zip \
            "${{ steps.version.outputs.version }}" \
            "v${{ steps.version.outputs.version }}" \
            "$RUNNER_TEMP/septask-updates"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/septask-updates
      - name: Deploy update site
        id: deployment
        uses: actions/deploy-pages@v4
