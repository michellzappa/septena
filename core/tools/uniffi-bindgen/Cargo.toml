# The bindings generator is a build tool. It is its own workspace, so its
# dependencies stay out of ../../Cargo.lock and out of the apps.
[package]
name = "uniffi-bindgen"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
uniffi = { version = "0.29", features = ["cli"] }

[workspace]
