[package]
name = "septena-core-wasm"
description = "wasm-bindgen wrapper of septena-core for the web client and the Worker (ADR 0025)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
septena-core = { path = "../septena-core", default-features = false }
serde_json = { version = "1", default-features = false, features = ["std"] }
wasm-bindgen = "0.2"
