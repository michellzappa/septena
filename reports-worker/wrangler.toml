name = "septena-reports"
main = "src/worker.ts"
compatibility_date = "2024-11-01"

# Served at reports.septena.app (custom domain on the septena.app Cloudflare
# zone — same pattern as the gateway's mcp.septena.app). The *.workers.dev URL
# keeps working as a fallback. Cloudflare provisions the DNS record + cert on
# deploy.
account_id = "50894cc73fc5188e3efb7eb9819c54e9"
routes = [{ pattern = "reports.septena.app", custom_domain = true }]

# Created with: wrangler kv namespace create REPORTS
# then paste the printed id below.
[[kv_namespaces]]
binding = "REPORTS"
id = "893586324c144d1fb6402b8a4427d49d"

# To serve on septena.app/r/* later, add a route here and remove workers.dev:
# [[routes]]
# pattern = "septena.app/r/*"
# zone_name = "septena.app"
