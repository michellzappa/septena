name = "septena-reports"
main = "src/worker.ts"
compatibility_date = "2024-11-01"

# Open-source template. Replace these placeholders before deploying your own
# report worker. Septena's production worker is configured outside this repo.
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"
routes = [{ pattern = "reports.example.com", custom_domain = true }]

# Created with: wrangler kv namespace create REPORTS
# then paste the printed id below.
[[kv_namespaces]]
binding = "REPORTS"
id = "YOUR_REPORTS_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "ATTEST"        # keyId → {publicKey, counter}
id = "YOUR_ATTEST_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "CHALLENGES"    # one-time attest nonces (short TTL)
id = "YOUR_CHALLENGES_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "RL"            # rate-limit buckets
id = "YOUR_RATE_LIMIT_KV_NAMESPACE_ID"

[vars]
# "off" | "audit" (verify + log, never reject) | "enforce".
# Keep the public template fail-closed. Use "audit" only while validating App
# Attest on a private staging worker with non-sensitive payloads.
ATTEST_MODE = "enforce"
# App Attest appId(s) = "<TEAM_ID>.<bundleId>". REPLACE the team id, and list
# both bundles (comma-separated) since reports can be created from iOS and Mac.
# Until set correctly the rpId check fails, which is intentional in enforce mode.
APP_ATTEST_APP_ID = "YOURTEAMID.com.example.septena,YOURTEAMID.com.example.septena.mac"
APP_ATTEST_ENV = "production"

# To serve on septena.app/r/* later, add a route here and remove workers.dev:
# [[routes]]
# pattern = "septena.app/r/*"
# zone_name = "septena.app"
